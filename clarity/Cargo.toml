[package]
name = "clarity"
version = "0.0.1"
authors = [ "Jude Nelson <jude@stacks.org>",
            "Aaron Blankstein <aaron@blockstack.com>",
            "Ludo Galabru <ludovic@blockstack.com>" ]
license = "GPLv3"
homepage = "https://github.com/blockstack/stacks-blockchain"
repository = "https://github.com/blockstack/stacks-blockchain"
description = "Reference implementation of the Stacks 2.0 Blockchain"
keywords = [ "stacks", "stx", "bitcoin", "crypto", "blockstack", "decentralized", "dapps", "blockchain" ]
edition = "2024"

[lib]
name = "clarity"
path = "./src/libclarity.rs"

[dependencies]
clarity-types = { package = "clarity-types", path = "../clarity-types", default-features = false }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
regex = "1"
integer-sqrt = "0.1.3"
slog = { workspace = true }
stacks_common = { package = "stacks-common", path = "../stacks-common", default-features = false }
rstest = { workspace = true, optional = true }
rstest_reuse = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
assert-json-diff = { workspace = true }
clarity-types = { package = "clarity-types", path = "../clarity-types", default-features = false, features = ["testing"] }
mutants = { workspace = true }
criterion = { workspace = true, features = ["default"] }
pinny = { workspace = true }
proptest = { workspace = true }
madhouse = { workspace = true }
rstest = { workspace = true }
rstest_reuse = { workspace = true }
stacks_common = { package = "stacks-common", path = "../stacks-common", default-features = false, features = ["testing"] }
itertools = "0.15.0"

[[bench]]
name = "sequence_ops"
harness = false

[[bench]]
name = "value_ref"
harness = false

[[bench]]
name = "sequence_higher_order"
harness = false

[[bench]]
name = "variadic_concat"
harness = false

[[bench]]
name = "function_lookup"
harness = false

[[bench]]
name = "trait_lookup"
harness = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_stacker = "0.1"

[features]
default = ["rusqlite"]
asset-map-json = ["clarity-types/asset-map-json"]
developer-mode = ["stacks_common/developer-mode", "clarity-types/developer-mode"]
slog_json = ["stacks_common/slog_json"]
rusqlite = ["stacks_common/rusqlite", "clarity-types/rusqlite", "dep:rusqlite"]
testing = ["rusqlite", "rstest", "rstest_reuse", "clarity-types/testing", "stacks_common/testing"]
devtools = []
rollback_value_check = []
disable-costs = []
wasm-web = ["stacks_common/wasm-web", "clarity-types/wasm-web"]

[package.metadata.pinny]
allowed = ["t_prop"]

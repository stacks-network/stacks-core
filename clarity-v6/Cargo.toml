[package]
name = "clarity-v6"
version = "1.0.0"
edition = "2024"
description = "Pinned Clarity 6 execution engine"
license = "GPLv3"
homepage = "https://github.com/stacks-network/stacks-core"
repository = "https://github.com/stacks-network/stacks-core"
keywords = ["stacks", "clarity", "smart-contracts", "blockchain"]

[dependencies]
clarity-kernel = { path = "../clarity-kernel", default-features = false }
clarity-types = { path = "../clarity-types", default-features = false }
integer-sqrt = "0.1.3"
lazy_static = { workspace = true }
regex = "1"
rstest = { version = "0.17.0", optional = true }
rstest_reuse = { version = "0.5.0", optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
stacks-common = { path = "../stacks-common", default-features = false }

[dev-dependencies]
clarity = { path = "../clarity", default-features = false, features = ["testing"] }
clarity-conformance = { path = "../clarity-conformance" }
proptest = { version = "1.6.0", default-features = false, features = ["std"] }

[features]
default = ["rusqlite"]
developer-mode = [
    "clarity-kernel/developer-mode",
    "clarity-types/developer-mode",
    "stacks-common/developer-mode",
]
slog_json = ["clarity-kernel/slog_json", "stacks-common/slog_json"]
rusqlite = [
    "clarity-kernel/rusqlite",
    "clarity-types/rusqlite",
    "stacks-common/rusqlite",
    "dep:rusqlite",
]
testing = [
    "rusqlite",
    "clarity-kernel/testing",
    "clarity-types/testing",
    "stacks-common/testing",
    "rstest",
    "rstest_reuse",
]
rollback_value_check = ["clarity-kernel/rollback_value_check"]
wasm-web = [
    "clarity-kernel/wasm-web",
    "clarity-types/wasm-web",
    "stacks-common/wasm-web",
]
disable-costs = []
devtools = []

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_stacker = "0.1"

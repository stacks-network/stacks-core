# Bitcoin signet follower template. Supply your Stacks network's launch parameters
# and bootstrap peers; this file alone does not join an existing Stacks network.
# See docs/bitcoin-signet.md before launching on an existing Bitcoin signet.

[node]
# Use a new working directory for a different deployment or signet challenge.
working_dir = "/tmp/stacks-signet-follower"
rpc_bind = "127.0.0.1:20443"
p2p_bind = "127.0.0.1:20444"
prometheus_bind = "0.0.0.0:9153"

# Explicitly not a miner or signer.
miner = false
stacker = false

[burnchain]
mode = "signet"
# Default Stacks chain ID: 0x80000001. Independent deployments can override it.
# All nodes, signers, and transaction clients must use the same chain ID.
# chain_id = 0x80000100
peer_host = "127.0.0.1"
peer_port = 38333
rpc_port = 38332
username = "stacks-signet"
password = "replace-with-a-local-password"
# Omit for public signet. Custom signet must match Core's signetchallenge:
# signet_challenge = "51"

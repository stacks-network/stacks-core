# ============================================================
# STACKS SIGNER NODE - TESTNET CONFIGURATION
# ============================================================
#
# This configures the stacks-node to work with a signer on testnet.
# This is the NODE-SIDE config. For the signer binary config, see
# signer/mainnet-signer-conf.toml (or create a testnet variant).
#
# Key coordination points between this config and the signer binary:
#   - [[events_observer]] endpoint must match signer's `endpoint`
#   - [connection_options] auth_token must match signer's `auth_password`

[node]
# working_dir = "/dir/to/save/chainstate" # defaults to: /tmp/stacks-node-[0-9]*
rpc_bind = "0.0.0.0:20443"
p2p_bind = "0.0.0.0:20444"
bootstrap_node = "0348af7ce1b224476e8f042727af3f84dcf49a69bb3c9dd2a1afaa783acfffb729@seed.testnet.hiro.so:20444"
prometheus_bind = "0.0.0.0:9153"
stacker = true

pox_5_sbtc_contract = "SN3VMHXEN64ZZF71JQ5VESXDWTR301XTTXGF4J8F1.sbtc-token"
pox_5_sbtc_registry_contract = "SN3VMHXEN64ZZF71JQ5VESXDWTR301XTTXGF4J8F1.sbtc-registry"
pox_5_bond_admin = "ST1V2ASRWGR81W7GBN1Z4W2JQKXJWCADPVZG30X45"

[burnchain]
mode = "krypton"
peer_host = "bitcoin.regtest.hiro.so"
rpc_port = 18443
peer_port = 18444
pox_prepare_length = 100
pox_reward_length = 900

# Signer event observer (REQUIRED).
# WARNING: endpoint must match your signer binary's `endpoint` config.
[[events_observer]]
endpoint = "127.0.0.1:30000"
events_keys = ["stackerdb", "block_proposal", "burn_blocks"]

# Optional: API event observer for stacks-blockchain-api service
# [[events_observer]]
# endpoint = "localhost:3700"
# events_keys = ["*"]
# timeout_ms = 60_000

[connection_options]
# WARNING: Must match the signer binary's `auth_password`.
auth_token = ""

# Maximum age of block proposals accepted by this node.
# Default: 600
# Units: seconds
# block_proposal_max_age_secs = 600

# Timeout for block proposal validation.
# Default: 60
# Units: seconds
# block_proposal_validation_timeout_secs = 60


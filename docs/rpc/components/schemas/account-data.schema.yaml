description: GET request for account data
type: object
additionalProperties: false
required:
  - balance
  - locked
  - unlock_height
  - nonce
properties:
  balance:
    type: string
    description: Spendable balance in micro-STX, as a hex-encoded unsigned 128-bit integer (big-endian). Does not include `locked`.
  locked:
    type: string
    description: Micro-STX locked by staking, as a hex-encoded unsigned 128-bit integer (big-endian). `0x00000000000000000000000000000000` once the burn block height of the queried tip reaches `unlock_height`.
  unlock_height:
    type: integer
    minimum: 0
    description: Bitcoin block height at which the locked amount becomes spendable (64-bit unsigned integer). `0` when nothing is locked.
  nonce:
    type: integer
    minimum: 0
    description: Account transaction nonce (64-bit unsigned integer)
  balance_proof:
    type: string
    description: Merkle proof for the balance value
  nonce_proof:
    type: string
    description: Merkle proof for the nonce value

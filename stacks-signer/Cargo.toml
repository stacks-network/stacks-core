[package]
name = "stacks-signer"
version.workspace = true
authors = [ "Jude Nelson <jude@stacks.org>" ]
license = "GPLv3"
homepage = "https://github.com/blockstack/stacks-blockchain"
repository = "https://github.com/blockstack/stacks-blockchain"
description = "Stacker signer binary"
keywords = [ "stacks", "stx", "bitcoin", "crypto", "blockstack", "decentralized", "dapps", "blockchain" ]
readme = "README.md"
edition = "2021"

[lib]
name = "stacks_signer"
path = "src/lib.rs"

[[bin]]
name = "stacks-signer"
path = "src/main.rs"

[dependencies]
backoff = "0.4"
clarity = { path = "../clarity" }
clap = { version = "4.1.1", features = ["derive", "env"] }
hashbrown = { workspace = true }
lazy_static = "1.4.0"
libsigner = { path = "../libsigner" }
libstackerdb = { path = "../libstackerdb" }
prometheus = { workspace = true, optional = true }
rand_core = "0.6"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
stacks-common = { path = "../stacks-common", features = ["rusqlite"] }
stackslib = { path = "../stackslib" }
thiserror = { workspace = true }
tiny_http = { workspace = true, optional = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true, features = ["functions"] }

[dev-dependencies]
clarity = { path = "../clarity", features = ["testing"] }
stacks-common = { path = "../stacks-common", features = ["testing"] }
stackslib = { path = "../stackslib", features = ["testing"] }
num-traits = "0.2.18"
stdext = "0.3.1"

[features]
default = []
monitoring_prom = ["prometheus", "tiny_http"]
testing = ["stacks-common/testing", "stackslib/testing"]

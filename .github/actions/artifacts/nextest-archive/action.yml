name: Nextest Archive Artifact
description: |
    Nextest binary archive artifact management.

inputs:
  action:
    description: "Type of operation (restore,create)"
    required: true
  archive-file:
    description: "The nextest archive file"
    required: true

runs:
  using: "composite"
  steps:
    - name: Restore Nextest Archive Artifact
      if: |
        inputs.action == 'restore'
      uses: ./.github/wrappers/download-artifact
      with:
        name: "nextest-archive"

    # Install the tool binaries bundled in the artifact (see the staging step
    # in the create path below)
    - name: Install Bundled Tools
      if: |
        inputs.action == 'restore'
      shell: bash
      run: |
        # upload-artifact does not preserve file permissions, so restore the
        # executable bit before putting the tools on $PATH
        chmod +x ci-tools/*
        mkdir -p "$HOME/.cargo/bin"
        mv -f ci-tools/* "$HOME/.cargo/bin/"

    # Checkout the code
    - name: Checkout the latest code
      if: |
        inputs.action == 'create'
      uses: $/.github/wrappers/checkout
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}

    # Setup rust toolchain
    - name: Setup Rust Toolchain
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/setup-rust-toolchain
      with:
        components: llvm-tools-preview

    #  Install nextest and cargo-llvm-cov
    #    cargo-llvm-cov is used to build the archive and then bundled into the
    #    artifact for the test jobs (see the staging step below)
    - name: Install nextest and cargo-llvm-cov
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/install-tool
      with:
        tools: nextest, cargo-llvm-cov

    # Stage the tool binaries so they are uploaded with the artifact. The many
    # parallel test jobs restore them from there instead of each downloading
    # from GitHub Releases, which rate-limits the runners' shared IPs (429)
    - name: Stage Tool Binaries for Upload
      if: |
        inputs.action == 'create'
      shell: bash
      run: |
        mkdir -p ci-tools
        cp "$(command -v cargo-nextest)" "$(command -v cargo-llvm-cov)" ci-tools/

    # Install mold linker and clang (faster than default)      
    - name: Install mold Linker (and clang)
      if: |
        inputs.action == 'create'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y mold clang

    # Restore the cargo cache
    - name: Restore Cargo Cache
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/cache/cargo
      with:
        action: restore

    # Build the nextest archive
    - name: Build Nextest Archive
      if: |
        inputs.action == 'create'
      shell: bash
      env:
        RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold -A warnings"
        CARGO_INCREMENTAL: 0
      # This command should be kept in sync with the same command in cache/cargo action
      run: |
        # Capture the archive file input, then expand the leading ~ to $HOME
        INPUT_FILE="${{ inputs.archive-file }}"
        ARCHIVE_FILE="${INPUT_FILE/#\~/$HOME}"

        cargo llvm-cov nextest-archive \
          --workspace \
          --tests \
          --locked \
          --features monitoring_prom \
          --archive-file "$ARCHIVE_FILE"

    - name: Create Nextest Archive Artifact
      if: |
        inputs.action == 'create'
      uses: ./.github/wrappers/upload-artifact
      with:
        name: "nextest-archive"
        path: |
          ${{ inputs.archive-file }}
          ci-tools/
        if-no-files-found: error
        retention-days: 1
        compression-level: 9 # 0 (none) - 9 (most)
        overwrite: true  

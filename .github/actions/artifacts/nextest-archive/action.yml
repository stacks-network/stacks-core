name: Nextest Archive Artifact
description: |
    Nextest binary archive artifact management.

inputs:
  action:
    description: "Type of operation (restore,create)"
    required: true
  archive-file:
    description: "The nextest archive file"
    required: true
runs:
  using: "composite"
  steps:
    - name: Restore Nextest Archive Artifact
      if: |
        inputs.action == 'restore'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
      with:
        name: "nextest-archive"

    # Install the tool binaries bundled in the artifact (see the staging step
    # in the create path below).
    - name: Install Bundled Tools
      if: |
        inputs.action == 'restore'
      shell: bash
      run: |
        mkdir -p "$HOME/.cargo/bin"
        tar --extract --zstd --file ci-tools.tar.zst --directory "$HOME/.cargo/bin"
        chmod +x "$HOME/.cargo/bin"/{cargo-nextest,grcov,llvm-cov,llvm-profdata}
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    # Checkout the code
    - name: Checkout the latest code
      if: |
        inputs.action == 'create'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}

    # Setup rust toolchain
    - name: Setup Rust Toolchain
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/setup-rust-toolchain
      with:
        components: llvm-tools-preview

    # Cache workspace-crate compilations by content. The Cargo cache excludes
    # them because restored target mtimes can otherwise mask source changes.
    - name: Setup sccache
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/setup-sccache

    #  Install nextest and grcov
    #    grcov is not needed to build the archive, but it is bundled into the
    #    artifact for the test jobs (see the staging step below)
    - name: Install nextest and grcov
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/install-tool
      with:
        tools: nextest, grcov

    # Stage the runtime tools so test jobs need neither GitHub release downloads
    # nor a Rust toolchain. grcov requires llvm-cov and llvm-profdata from the
    # exact toolchain used to instrument the archived binaries.
    - name: Stage Tool Binaries for Upload
      if: |
        inputs.action == 'create'
      shell: bash
      run: |
        mkdir -p ci-tools
        RUST_HOST=$(rustc -vV | sed -n 's/^host: //p')
        LLVM_TOOLS_DIR="$(rustc --print sysroot)/lib/rustlib/${RUST_HOST}/bin"
        cp \
          "$(command -v cargo-nextest)" \
          "$(command -v grcov)" \
          "${LLVM_TOOLS_DIR}/llvm-cov" \
          "${LLVM_TOOLS_DIR}/llvm-profdata" \
          ci-tools/
        tar --create --zstd --file ci-tools.tar.zst --directory ci-tools .

    # Install mold linker and clang (faster than default)      
    - name: Install mold Linker (and clang)
      if: |
        inputs.action == 'create'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y mold clang

    # Restore the cargo cache
    - name: Restore Cargo Cache
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/cache/cargo
      with:
        action: restore

    # Build the nextest archive
    - name: Build Nextest Archive
      if: |
        inputs.action == 'create'
      shell: bash
      env:
        RUSTFLAGS: "-C instrument-coverage -C linker=clang -C link-arg=-fuse-ld=mold -A warnings"
        CARGO_INCREMENTAL: 0
      # This command should be kept in sync with the same command in cache/cargo action
      run: |
        # Capture the archive file input, then expand the leading ~ to $HOME
        INPUT_FILE="${{ inputs.archive-file }}"
        ARCHIVE_FILE="${INPUT_FILE/#\~/$HOME}"

        cargo nextest archive \
          --workspace \
          --tests \
          --locked \
          --features monitoring_prom \
          --archive-file "$ARCHIVE_FILE"

        cargo nextest list \
          --archive-file "$ARCHIVE_FILE" \
          --message-format json \
          > nextest-test-list.json

    # Matrix-generation jobs only need the test manifest. Keep it separate so
    # they do not download the much larger archive and debug binaries.
    - name: Create Nextest Test List Artifact
      if: |
        inputs.action == 'create'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
      with:
        name: "nextest-test-list"
        path: nextest-test-list.json
        if-no-files-found: error
        retention-days: 1
        compression-level: 9
        overwrite: true

    - name: Create Nextest Archive Artifact
      if: |
        inputs.action == 'create'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
      with:
        name: "nextest-archive"
        path: |
          ${{ inputs.archive-file }}
          ci-tools.tar.zst
        if-no-files-found: error
        retention-days: 1
        # The nextest archive and tool binaries are already compressed or
        # incompressible; recompressing them only delays every test job.
        compression-level: 0
        overwrite: true  

name: Create Releases
description: |
    Creates the GitHub Release

inputs:
    tag:
        description: "Release Tag (e.g. 4.0.0)"
        required: true
    digest_manifest:
        description: "Path to docker digest manifest directory (optional)"
        required: false
        default: ""
    hashfile_name:
        description: "The name of the generated checksum file"
        required: false
        default: "CHECKSUMS.txt"
    release-app-client-id:
        description: "The client ID of the GitHub App used for releases"
        required: true
    release-app-private-key:
        description: "The private key of the GitHub App used for releases"
        required: true

runs:
    using: "composite"
    steps:
        # Checkout the code
        - name: Checkout the latest code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            ref: ${{ github.event.pull_request.head.sha || github.ref }}

        # Downloads the artifacts built in `create-source-binary`
        #   - the archives contain both the stacks-node and stacks-signer binaries
        - name: Download Artifacts
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
              pattern: "${{ github.sha }}-stacks-core*"
              path: release
              merge-multiple: true

        - name: Generate Checksums
          shell: bash
          run: |
            # shellcheck disable=SC1091
            source ./.github/scripts/logging.sh
    
            ## ── Check for required binaries ─────────────────────────────────────
            if ! command -v sha512sum > /dev/null 2>&1; then
                error "$(hl "sha512sum") command not found"
                exit 1
            fi
    
            ## ── Generate checksums ──────────────────────────────────────────────
            cd release || {
                error "Artifact directory $(hl "release") does not exist"
                exit 1
            }
    
            shasum="$(sha512sum *)" || {
                error "Checksum could not be generated"
                exit 1
            }
    
            info "Generated checksums:"
            echo "${shasum}"
            echo "${shasum}" > "${{ inputs.hashfile_name }}"

        # Generate the release body from the template and changelog
        - name: Draft Release Body
          id: draft
          shell: bash
          env:
              VERSION: ${{ inputs.tag }}
              CHANGELOG: CHANGELOG.md
              TEMPLATE: .github/actions/release/release.template
              REPO: ${{ github.repository }}
              DIGEST_MANIFEST: ${{ inputs.digest_manifest }}
          run: |
            bash ./.github/scripts/draft_release.sh

        # Generate release token from our GH App which has permissions to create a release tag
        - name: Generate Release Token
          id: generate-token
          uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
          with:
            client-id: ${{ inputs.release-app-client-id }}
            private-key: ${{ inputs.release-app-private-key }}
            
        # Manually create tag using GitHub App token before creating the draft release
        # This is required because a user publishes the draft release, and they don't have permission to create the tag
        - name: Create Git Tag
          uses: actions/github-script@v7
          with:
            github-token: ${{ steps.generate-token.outputs.token }}
            script: |
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'refs/tags/${{ inputs.tag }}',
                  sha: context.sha
                });
              } catch (error) {
                if (error.status === 422) {
                  core.info('Tag ${{ inputs.tag }} already exists. Skipping creation.');
                } else {
                  throw error;
                }
              }

        # Create draft the release with attached archives, checksums file, and attestations
        # Also pre-populates the release body text
        - name: Create Release
          uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
          env:
            GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          with:
              name: "Release ${{ inputs.tag }}"
              tag_name: ${{ inputs.tag }}
              body: ${{ steps.draft.outputs.release_body }}
              draft: true
              prerelease: true
              fail_on_unmatched_files: true
              target_commitish: ${{ github.sha }}
              generate_release_notes: false
              files: |
                  release/*.zip
                  release/${{ inputs.hashfile_name }}

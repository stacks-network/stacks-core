name: Docker Setup
description: |
    Defaults for building docker images

inputs:
    username:
        description: "Docker repo username"
        required: false
        default: ""
    password:
        description: "Docker repo password"
        required: false
        default: ""
    registry:
        description: "Docker Registry"
        required: false
        default: "docker.io"

outputs:
  docker_push:
    description: "True if the branch is a release (default: false)"
    value: ${{ steps.set_vars.outputs.docker_push }}

runs:
    using: "composite"
    steps:
        # Enable push to registry if we have credentials
        - name: Set Vars
          id: set_vars
          shell: bash
          run: |
              echo "docker_push=${{ (inputs.username != '') && (inputs.password != '') }}" >> $GITHUB_OUTPUT

        # Setup QEMU for multi-arch builds
        - name: Set up QEMU
          uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
          with:
              cache-image: false # don't cache the binfmt image

        # Setup docker buildx
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
          with:
              cache-binary: false

        # Login to docker registry
        - name: Docker Login
          if: |
              inputs.username != '' &&
              inputs.password != ''
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
              registry: ${{ inputs.registry }}
              username: ${{ inputs.username }}
              password: ${{ inputs.password }}
              logout: true

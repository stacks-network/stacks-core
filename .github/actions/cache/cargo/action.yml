name: Cargo Cache
description: |
    Cargo crate cache management.

inputs:
  action:
    description: "Type of operation (check,restore,create)"
    required: false
    default: "check"

outputs:
  cache-key:
    description: "Cache Key"
    value: ${{ steps.generate-keys.outputs.cargo-cache-key }}
  cache-matched-key:
    description: "Key of the cache that was checked or restored, it could either be the primary key on cache-hit or a partial/complete match of one of the restore keys."
    value: ${{ steps.check-cache.outputs.cache-matched-key || steps.restore-cache.outputs.cache-matched-key }}

runs:
  using: "composite"
  steps:
    # Generate cache keys
    - name: Generate Cache Keys
      id: generate-keys
      uses: ./.github/actions/cache/generate-keys
      
    # Check if cache data exists
    - name: Check Cache
      if: |
        inputs.action == 'check'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: check-cache
      with:
        lookup-only: true
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.generate-keys.outputs.cargo-cache-key }}
        # Allows cache to "fallback" to `main` generated cache, using a prefix. The most recently created cache will be selected.
        restore-keys: ${{ steps.generate-keys.outputs.cargo-restore-key }}

    # Restore cache data
    - name: Restore Cache
      if: |
        inputs.action == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: restore-cache
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.generate-keys.outputs.cargo-cache-key }}
        # Allows cache to "fallback" to `main` generated cache, using a prefix. The most recently created cache will be selected.
        restore-keys: ${{ steps.generate-keys.outputs.cargo-restore-key }}
        fail-on-cache-miss: true

    # Cache extraction makes target files newer than the checkout. Refresh only
    # sources whose Git blob changed so Cargo can safely reuse unchanged local
    # crates and test harnesses from the default-branch cache.
    - name: Restore Workspace Source Freshness
      if: |
        inputs.action == 'restore'
      shell: bash
      run: bash ./.github/scripts/restore_cargo_freshness.sh

    # Checkout the code
    - name: Checkout the latest code
      if: |
        inputs.action == 'create'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.ref }}
  
    # Setup rust toolchain
    - name: Setup Rust Toolchain
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/setup-rust-toolchain

    # Populate the shared compiler cache while creating the default-branch
    # Cargo cache so pull-request builds can reuse unchanged workspace crates.
    - name: Setup sccache
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/setup-sccache
    
    #  Install nextest
    - name: Install nextest
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/install-tool
      with:
        tools: nextest
    
    # Clang is preinstalled on GitHub's Ubuntu runners. Downloading mold
    # directly avoids refreshing apt metadata in the cache-generation job.
    - name: Install mold Linker
      if: |
        inputs.action == 'create'
      uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1, mold 2.42.0
      with:
        make-default: false
  
    # Build the cargo crates
    - name: Build Cargo Crates
      if: |
        inputs.action == 'create'
      shell: bash
      env:
        RUSTFLAGS: "-C instrument-coverage -C linker=clang -C link-arg=-fuse-ld=mold -A warnings"
        CARGO_INCREMENTAL: 0
      # This command should be kept in sync with the same command in artifacts/nextest-archive action
      run: |
        cargo nextest archive \
          --workspace \
          --tests \
          --locked \
          --features monitoring_prom \
          --archive-file "not_used.tar.zst"
  
    # Record content identities so restore jobs can invalidate changed sources
    # without throwing away every reusable workspace artifact.
    - name: Record Workspace Source Index
      if: |
        inputs.action == 'create'
      shell: bash
      run: |
        git ls-files -s -z > target/.ci-workspace-source-index
  
    # Save cache data
    - name: Save Cache
      if: |
        inputs.action == 'create'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.generate-keys.outputs.cargo-cache-key }}

name: Cargo Cache
description: |
    Cargo crate cache management.

inputs:
  action:
    description: "Type of operation (check,restore,create)"
    required: false
    default: "check"

outputs:
  cache-key:
    description: "Cache Key"
    value: ${{ steps.generate-keys.outputs.cargo-cache-key }}
  cache-matched-key:
    description: "Key of the cache that was checked or restored, it could either be the primary key on cache-hit or a partial/complete match of one of the restore keys."
    value: ${{ steps.check-cache.outputs.cache-matched-key || steps.restore-cache.outputs.cache-matched-key }}

runs:
  using: "composite"
  steps:
    # Generate cache keys
    - name: Generate Cache Keys
      id: generate-keys
      uses: ./.github/actions/cache/generate-keys
      
    # Check if cache data exists
    - name: Check Cache
      if: |
        inputs.action == 'check'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: check-cache
      with:
        lookup-only: true
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.generate-keys.outputs.cargo-cache-key }}
        # Allows cache to "fallback" to `main` generated cache, using a prefix. The most recently created cache will be selected.
        restore-keys: ${{ steps.generate-keys.outputs.cargo-restore-key }}

    # Restore cache data
    - name: Restore Cache
      if: |
        inputs.action == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: restore-cache
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.generate-keys.outputs.cargo-cache-key }}
        # Allows cache to "fallback" to `main` generated cache, using a prefix. The most recently created cache will be selected.
        restore-keys: ${{ steps.generate-keys.outputs.cargo-restore-key }}
        fail-on-cache-miss: true

    # Checkout the code
    - name: Checkout the latest code
      if: |
        inputs.action == 'create'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.ref }}
  
    # Setup rust toolchain
    - name: Setup Rust Toolchain
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/setup-rust-toolchain
      with:
        components: llvm-tools-preview
    
    #  Install nextest and cargo-llvm-cov
    - name: Install nextest and cargo-llvm-cov
      if: |
        inputs.action == 'create'
      uses: ./.github/actions/install-tool
      with:
        tools: nextest, cargo-llvm-cov
    
    # Install mold linker and clang (faster than default)      
    - name: Install mold Linker (and clang)
      if: |
        inputs.action == 'create'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y mold clang
  
    # Build the cargo crates
    - name: Build Cargo Crates
      if: |
        inputs.action == 'create'
      shell: bash
      env:
        RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold -A warnings"
        CARGO_INCREMENTAL: 0
      # This command should be kept in sync with the same command in artifacts/nextest-archive action OTHER than the excludes
      # We exclude workspace crates because we only want to cache cargo dependencies
      run: |
        cargo llvm-cov nextest archive \
          --workspace \
          --exclude clarity \
          --exclude clarity-cli \
          --exclude clarity-types \
          --exclude libsigner \
          --exclude libstackerdb \
          --exclude madhouse \
          --exclude marf-squash \
          --exclude pox-locking \
          --exclude stacks-cli \
          --exclude stacks-codec \
          --exclude stacks-common \
          --exclude stacks-inspect \
          --exclude stacks-node \
          --exclude stacks-profiler \
          --exclude stacks-profiler-macros \
          --exclude stacks-signer \
          --exclude stacks-transactions \
          --exclude stackslib \
          --exclude stx-genesis \
          --tests \
          --locked \
          --features monitoring_prom \
          --archive-file "not_used.tar.zst"
  
    # Save cache data
    - name: Save Cache
      if: |
        inputs.action == 'create'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.generate-keys.outputs.cargo-cache-key }}

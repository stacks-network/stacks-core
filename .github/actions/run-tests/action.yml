name: Run Tests
description: |
  1. Restores the archived test tooling and installs LLVM coverage tools.
  2. Runs tests using nextest, either sequentially by name or in parallel via partitions.
  3. Generates and uploads the code coverage artifact

inputs:
  btc-version:
    description: "Bitcoin version"
    required: false
    default: "25.0"
  test-names:
    description: "Comma-separated list of literal test names to run (Required if not partitioning)"
    required: false
  test-threads:
    description: "Number of named tests to run concurrently"
    required: false
    default: "1"
  partition:
    description: "Partition to run (e.g., 1)"
    required: false
  total-partitions:
    description: "Total number of partitions (e.g., 4)"
    required: false
  test-timings-file:
    description: "Historical timings used to balance partitions or prioritize named tests"
    required: false
  excluded-test-names:
    description: "Comma-separated literal test names excluded from runtime-balanced partitions"
    required: false
  no-fail-fast:
    description: "Whether to continue running selected tests after a failure"
    required: false
    default: "false"
  archive-file:
    description: "Archive file to use for tests"
    required: true
  archive-artifact-name:
    description: "Artifact containing the archive file and bundled tools"
    required: false
    default: "nextest-archive"
  debug-binary-path:
    description: "Debug binary path"
    required: true
  codecov-test-name:
    description: "Code coverage test name"
    required: true
  upload-junit-xml:
    description: "Whether or not to upload the nextest JUnit XML artifact"
    required: true
  upload-code-coverage:
    description: "Whether to upload this job's code coverage to Coveralls"
    required: true

runs:
  using: "composite"
  steps:
    ############################################################################
    ### Setup test environment
    ############################################################################
    
    # Checkout the code
    - name: Checkout the latest code
      id: git_checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}

    # Unit tests call Cargo at runtime to locate workspace fixtures, and grcov's
    # LLVM tools depend on shared libraries from the matching Rust sysroot.
    - name: Setup Rust Toolchain
      uses: ./.github/actions/setup-rust-toolchain
      with:
        components: llvm-tools-preview

    # Restore bitcoin cache data
    - name: Restore Bitcoin Binary Cache
      uses: ./.github/actions/cache/bitcoin
      with:
        action: restore
        btc-version: ${{ inputs.btc-version }}

    # Symlink bitoind to $PATH
    - name: Link Bitcoin Binary
      shell: bash
      run: |
        sudo ln -s ~/bitcoin/bin/bitcoind /bin/

    # Avoid concurrent signer testcontainers clients racing to pull the same
    # image on a fresh runner. Other batches retain lazy-pull behavior.
    - name: Prepare Bitcoin Test Container
      if: >-
        env.BITCOIN_TESTCONTAINERS == '1' &&
        contains(inputs.test-names, 'tests::signer::')
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if timeout --kill-after=30s 5m \
            docker pull "bitcoin/bitcoin:${BITCOIN_IMAGE_TAG}"
          then
            exit 0
          fi

          if (( attempt == 3 )); then
            echo "::error::Failed to pull Bitcoin test image after ${attempt} attempts"
            exit 1
          fi

          # Concurrent matrix jobs can briefly overwhelm Docker Hub's
          # anonymous registry endpoint. Stagger retries to avoid a herd.
          retry_delay=$((attempt * 10 + RANDOM % 10))
          echo "Bitcoin image pull failed; retrying in ${retry_delay}s"
          sleep "$retry_delay"
        done

    # Increase open file descriptors limit
    - name: Increase Open File Descriptors
      shell: bash
      run: |
        sudo prlimit --nofile=4096:4096

    # Restore Nextest archive artifact
    - name: Restore Nextest Archive Artifact
      uses: ./.github/actions/artifacts/nextest-archive
      with:
        action: restore
        archive-file: ${{ inputs.archive-file }}
        artifact-name: ${{ inputs.archive-artifact-name }}

    ############################################################################
    ### Run the tests
    ############################################################################
  
    # Step 1: Validate Inputs
    - name: Validate Inputs
      shell: bash
      run: |
        TEST_NAMES="${{ inputs.test-names }}"
        PARTITION="${{ inputs.partition }}"
        TOTAL="${{ inputs.total-partitions }}"

        # Case 1: Absolutely nothing provided
        if [ -z "$TEST_NAMES" ] && [ -z "$PARTITION" ] && [ -z "$TOTAL" ]; then
          echo "::error::Invalid inputs. You must provide either 'test-names' OR both 'partition' and 'total-partitions'."
          exit 1
        fi

        # Case 2: Conflicting inputs (provided both styles)
        if [ -n "$TEST_NAMES" ] && { [ -n "$PARTITION" ] || [ -n "$TOTAL" ]; }; then
          echo "::error::Ambiguous inputs. Cannot provide 'test-names' alongside 'partition' or 'total-partitions'."
          exit 1
        fi

        # Case 3: Partition logic validation
        if [ -n "$PARTITION" ] || [ -n "$TOTAL" ]; then
          # Ensure both partition inputs exist
          if [ -z "$PARTITION" ] || [ -z "$TOTAL" ]; then
            echo "::error::Both 'partition' and 'total-partitions' must be specified together."
            exit 1
          fi

          # Ensure they are valid positive integers
          if ! [[ "$PARTITION" =~ ^[0-9]+$ ]] || ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then
            echo "::error::'partition' and 'total-partitions' must be positive integers."
            exit 1
          fi

          # Ensure total-partitions is greater than 0
          if [ "$TOTAL" -le 0 ]; then
            echo "::error::'total-partitions' must be greater than 0."
            exit 1
          fi

          # Ensure partition index is greater than 0 (Nextest count partitioning is 1-indexed)
          if [ "$PARTITION" -le 0 ]; then
            echo "::error::'partition' must be 1 or greater."
            exit 1
          fi

          # Ensure partition doesn't exceed total
          if [ "$PARTITION" -gt "$TOTAL" ]; then
            echo "::error::'partition' ($PARTITION) cannot be greater than 'total-partitions' ($TOTAL)."
            exit 1
          fi
        fi
        
        echo "Inputs validated successfully!"

    # Modify test-name input to be a valid filename, since we use it to name the junit test file and the code coverage file
    - name: Generate Sanitized File Name
      id: generate-sanitized-file-name
      shell: bash
      run: |
        SANITIZED_FILE_NAME=$(echo "${{ inputs.codecov-test-name }}" | sed 's/[\\/:\*\?"<>|]/_/g')
        echo "file-name=$SANITIZED_FILE_NAME" >> $GITHUB_OUTPUT

    # Start the longest named tests first so concurrent slots finish together.
    - name: Generate Named-Test Priority Config
      id: generate-named-test-priority-config
      if: inputs.partition == '' && inputs.test-timings-file != ''
      shell: bash
      env:
        TEST_NAMES_CSV: ${{ inputs.test-names }}
        TEST_TIMINGS_FILE: ${{ inputs.test-timings-file }}
      run: |
        OUTPUT_CONFIG_FILE="./.github/nextest/ci-nextest-prioritized.toml"
        TEST_NAMES_CSV="$TEST_NAMES_CSV" \
        TEST_TIMINGS_FILE="$TEST_TIMINGS_FILE" \
        BASE_CONFIG_FILE="./.github/nextest/ci-nextest.toml" \
        OUTPUT_CONFIG_FILE="$OUTPUT_CONFIG_FILE" \
        NEXTEST_PROFILE="ci-sequential" \
          bash ./.github/scripts/generate_nextest_priority_config.sh
        echo "config-file=$OUTPUT_CONFIG_FILE" >> "$GITHUB_OUTPUT"

    # Mode 1: Run specific test names sequentially (If partition is NOT specified)
    - name: Run Tests Sequentially
      if: inputs.partition == '' && inputs.total-partitions == ''
      shell: bash
      run: |
        export LLVM_PROFILE_FILE="test-results-%p-%m.profraw"

        NEXTEST_FAILURE_ARGS=()
        if [[ "${{ inputs.no-fail-fast }}" == "true" ]]; then
          NEXTEST_FAILURE_ARGS+=(--no-fail-fast)
        fi
        
        # Convert CSV string to Nextest exact-match Filterset format
        # e.g., "a, b" becomes "test(=a)|test(=b)"
        FILTERSET=$(echo "${{ inputs.test-names }}" | sed -E 's/[[:space:]]*,[[:space:]]*/)|test(=/g')
        FILTERSET="test(=${FILTERSET})"
        NEXTEST_CONFIG_FILE="${{ steps.generate-named-test-priority-config.outputs.config-file }}"
        NEXTEST_CONFIG_FILE="${NEXTEST_CONFIG_FILE:-./.github/nextest/ci-nextest.toml}"

        # nextest settings are configured in ~/.github/nextest/ci-nextest.toml, arguments here override those settings
        test_exit=0
        cargo-nextest nextest run \
          --config-file "$NEXTEST_CONFIG_FILE" \
          --profile ci-sequential \
          --test-threads "${{ inputs.test-threads }}" \
          --run-ignored all \
          --archive-file ${{ inputs.archive-file }} \
          --extract-to . \
          --extract-overwrite \
          "${NEXTEST_FAILURE_ARGS[@]}" \
          -E "$FILTERSET" \
          || test_exit=$?
          
        # rename the resulting junit file from the toml config
        mv junit.xml junit_${{ steps.generate-sanitized-file-name.outputs.file-name }}.xml
        exit "$test_exit"

    # Mode 2: Run Partitioned Tests (If partition IS specified)
    - name: Run Partitioned Tests
      if: inputs.partition != '' && inputs.total-partitions != ''
      shell: bash
      run: |
        export LLVM_PROFILE_FILE="test-results-%p-%m.profraw"

        PARTITION_ARGS=(--partition count:${{ inputs.partition }}/${{ inputs.total-partitions }})
        TEST_ARGS=()

        if [[ -n "${{ inputs.test-timings-file }}" ]]; then
          TEST_LIST_FILE=$(mktemp)
          trap 'rm -f "$TEST_LIST_FILE"' EXIT
          NEXTEST_ARCHIVE="${{ inputs.archive-file }}" \
          TEST_TIMINGS_FILE="${{ inputs.test-timings-file }}" \
          EXCLUDED_TEST_NAMES_CSV="${{ inputs.excluded-test-names }}" \
          PARTITION="${{ inputs.partition }}" \
          TOTAL_PARTITIONS="${{ inputs.total-partitions }}" \
          TEST_LIST_OUTPUT="$TEST_LIST_FILE" \
            bash ./.github/scripts/balance_unit_tests.sh

          mapfile -t TEST_NAMES < "$TEST_LIST_FILE"
          PARTITION_ARGS=()
          TEST_ARGS=(-- "${TEST_NAMES[@]}" --exact)

          NEXTEST_CONFIG_FILE="./.github/nextest/ci-nextest-prioritized.toml"
          TEST_NAMES_FILE="$TEST_LIST_FILE" \
          TEST_TIMINGS_FILE="${{ inputs.test-timings-file }}" \
          BASE_CONFIG_FILE="./.github/nextest/ci-nextest.toml" \
          OUTPUT_CONFIG_FILE="$NEXTEST_CONFIG_FILE" \
          NEXTEST_PROFILE="ci-parallel" \
          RECORDED_TESTS_ONLY="true" \
            bash ./.github/scripts/generate_nextest_priority_config.sh
        fi

        NEXTEST_CONFIG_FILE="${NEXTEST_CONFIG_FILE:-./.github/nextest/ci-nextest.toml}"

        # nextest settings are configured in ~/.github/nextest/ci-nextest.toml, arguments here override those settings
        test_exit=0
        cargo-nextest nextest run \
          --config-file "$NEXTEST_CONFIG_FILE" \
          --profile ci-parallel \
          "${PARTITION_ARGS[@]}" \
          --archive-file "${{ inputs.archive-file }}" \
          --extract-to . \
          --extract-overwrite \
          "${TEST_ARGS[@]}" \
          || test_exit=$?
          
        # rename the resulting junit file from the toml config
        mv junit.xml junit_${{ steps.generate-sanitized-file-name.outputs.file-name }}.xml
        exit "$test_exit"
          
    ############################################################################
    ### Upload the nextest JUnit XML
    ############################################################################

    # Store JUnit file in GitHub CI artifacts (with SHA and "nextest" prefix)
    - name: Store JUnit Report as Artifact
      if: always() && inputs.upload-junit-xml == 'true'
      # JUnit is diagnostic data. A transient artifact-service outage must not
      # suppress coverage or turn passing tests into a failed required check.
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
      with:
        name: nextest-${{ steps.generate-sanitized-file-name.outputs.file-name }}
        path: junit_${{ steps.generate-sanitized-file-name.outputs.file-name }}.xml
        if-no-files-found: error
        retention-days: 1
        compression-level: 9 # 0 (none) - 9 (most)
        overwrite: true
          
    ############################################################################
    ### Generate and upload code coverage
    ############################################################################

    # Generate code coverage using grcov
    # Resulting coverage filenames must be unique, so use test-name input to name the file
    - name: Run grcov
      if: inputs.upload-code-coverage == 'true'
      shell: bash
      run: |
        grcov . \
          -b ${{ inputs.debug-binary-path }} \
          -s . \
          -t lcov \
          --llvm \
          --branch \
          --ignore-not-existing \
          --ignore "../*" \
          --ignore "/*" \
          --ignore ".github/**" \
          --ignore ".vscode/**" \
          --ignore "changelog.d/**" \
          --ignore "contrib/**" \
          --ignore "**/.cargo/**" \
          --ignore "**/benches/**" \
          --ignore "**/test{,s}/**" \
          --ignore "**/test{,s}.rs" \
          --ignore "**/*_test{,s}.rs" \
          --ignore "**/*.clar" \
          --ignore "**/*.json" \
          --ignore "**/*.md" \
          --ignore "**/*.sha256" \
          --ignore "**/*.snap" \
          --ignore "**/*.toml" \
          --ignore "**/*.txt" \
          --ignore "**/*.yml" \
          -o lcov_${{ steps.generate-sanitized-file-name.outputs.file-name }}.info \
        || exit 1

        if ! grep -q '^SF:' lcov_${{ steps.generate-sanitized-file-name.outputs.file-name }}.info; then
          echo "::error::grcov produced an empty LCOV report"
          exit 1
        fi

    # Attribute merge-queue coverage to the destination branch so it becomes
    # the comparison base after the queued commit lands.
    - name: Prepare Coveralls Context
      id: prepare-coveralls-context
      if: inputs.upload-code-coverage == 'true'
      shell: bash
      env:
        MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
      run: |
        echo "git-branch=${MERGE_GROUP_BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

    # Coveralls' parallel-build protocol unions reports server-side. Uploading
    # from the producing job avoids a serialized artifact fan-in and lcov merge.
    - name: Upload Code Coverage to Coveralls
      if: inputs.upload-code-coverage == 'true'
      uses: ./.github/actions/coveralls-upload
      with:
        files: lcov_${{ steps.generate-sanitized-file-name.outputs.file-name }}.info
        # Keep the build open across "rerun failed jobs" so successful reports
        # from the first attempt remain available to the finalizer.
        build-number: ${{ github.run_id }}
        flag-name: ${{ steps.generate-sanitized-file-name.outputs.file-name }}
        parallel: 'true'
        git-branch: ${{ steps.prepare-coveralls-context.outputs.git-branch }}

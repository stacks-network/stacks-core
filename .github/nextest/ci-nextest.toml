[profile.ci]
# Stop at the first test failure in CI
fail-fast = true
# Retry failed tests up to 2 times
retries = 2
# set slow timeout to 5 minutes and test termination to 20 minutes total (4 periods of 5 minutes)
slow-timeout = { period = "5m", terminate-after = 4, on-timeout = "fail" }

# --- Output and Verbosity Configuration ---

# When to display standard output and standard error for failing tests
# Options: "immediate", "immediate-final", "final", "never"
failure-output = "final"
# When to display standard output and standard error for passing tests
# Options: "immediate", "immediate-final", "final", "never"
success-output = "never"
# Which test statuses (PASS, FAIL, etc.) to display during the run
# Options: "none", "fail", "retry", "slow", "leak", "pass", "skip", "all"
status-level = "pass"

[profile.ci.junit]
# Create JUnit output that we can parse
path = "../../../junit.xml"

[profile.ci-sequential]
inherits = "ci"
# The number of tests to run simultaneously
# Options: A positive integer (e.g., 4), "num-cpus", or a negative integer (e.g., -1)
test-threads = 1

# This test starts 20 signer instances and can time out during registration
# when another signer-heavy integration test runs beside it.
[[profile.ci-sequential.overrides]]
filter = 'test(=tests::signer::v0::block_validation_check_rejection_timeout_heuristic)'
threads-required = "num-test-threads"

# These tests build and insert roughly 169,000 signed transactions. Running a
# second node integration beside them lengthens the batch critical path.
[[profile.ci-sequential.overrides]]
filter = 'test(/^tests::(?:signer::v0::large_mempool|marf::.*::large_mempool)/)'
threads-required = "num-test-threads"

# A signer integration test owns a bitcoind container plus one or more Stacks
# nodes and signers. On four-vCPU runners, charge each test two execution slots
# so no more than two signer harnesses contend at once. Keep this value aligned
# with SIGNER_TEST_THREADS_REQUIRED in _tests-bitcoin.yml.
[[profile.ci-sequential.overrides]]
filter = 'test(/^tests::signer::/)'
threads-required = 2

[profile.ci-parallel]
inherits = "ci"
# The number of tests to run simultaneously
# Options: A positive integer (e.g., 4), "num-cpus", or a negative integer (e.g., -1)
test-threads = "num-cpus"

# This parser stress test and the large-contract tests contend heavily for
# memory bandwidth. Reserving the runner for it prevents both workloads from
# becoming several times slower while leaving the rest of the suite parallel.
[[profile.ci-parallel.overrides]]
filter = 'test(=chainstate::tests::parse_tests::test_cost_balance_exceeded)'
threads-required = "num-test-threads"

name: "Upload Artifact"
description: "Wraps actions/upload-artifact with standardized defaults"

inputs:
  name:
    description: 'Name of the artifact to upload'
    required: false
  path:
    description: 'A file, directory, or wildcard pattern describing what to upload'
    required: true
  retention-days:
    description: 'Duration in days after which the artifact expires'
    required: false
    default: '14'
  if-no-files-found:
    description: 'Action to take if no files are found: warn, error, or ignore'
    required: false
    default: 'error'
  compression-level:
    description: 'Zstd compression level from 0 (fastest) to 9 (best compression)'
    required: false
    default: '9'
  overwrite:
    description: 'If true, an artifact with a matching name will be deleted before a new one is uploaded'
    required: false
    default: 'false'
  include-hidden-files:
    description: 'Whether to include hidden files in the provided path in the artifact'
    required: false
    default: 'false'
  archive:
    description: 'Whether to zip the artifact files before upload'
    required: false
    default: 'true'

outputs:
  artifact-id:
    description: >
      A unique identifier for the artifact that was just uploaded. Empty if the artifact upload failed.

      This ID can be used as input to other APIs to download, delete or get more information about an artifact: https://docs.github.com/en/rest/actions/artifacts
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
  artifact-url:
    description: >
      A download URL for the artifact that was just uploaded. Empty if the artifact upload failed.

      This download URL only works for requests Authenticated with GitHub. Anonymous downloads will be prompted to first login. 
      If an anonymous download URL is needed than a short time restricted URL can be generated using the download artifact API: https://docs.github.com/en/rest/actions/artifacts#download-an-artifact    

      This URL will be valid for as long as the artifact exists and the workflow run and repository exists. Once an artifact has expired this URL will no longer work.
    value: ${{ steps.upload-artifact.outputs.artifact-url }}
  artifact-digest:
    description: >
      SHA-256 digest for the artifact that was just uploaded. Empty if the artifact upload failed.
    value: ${{ steps.upload-artifact.outputs.artifact-digest }}

runs:
  using: 'composite'
  steps:
    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}

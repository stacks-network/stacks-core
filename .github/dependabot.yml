# Dependabot version updates.
#
# PAUSED: `open-pull-requests-limit: 0` disables version updates for every
# ecosystem below while concerns are resolved. Restore the limits (previously
# 5) to re-enable.
#
# Security updates are not affected by the cooldowns below: Dependabot opens
# those as soon as an advisory is published.
#
# The cooldowns delay *version* updates until a release has been public for a
# while, so a compromised or broken release is usually yanked before we ever
# see a PR for it.
#
# Setting `labels` replaces Dependabot's defaults, so they are listed again
# alongside "no changelog", which skips the changelog-fragment check.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      # One PR for all semver-compatible updates; majors get their own PRs.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
      - no changelog
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
      - "/.github/actions/*/*"
      - "/.github/wrappers/*"
      - "/.github/wrappers/*/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github_actions
      - no changelog
    open-pull-requests-limit: 0

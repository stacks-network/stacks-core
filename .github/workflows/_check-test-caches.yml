# GitHub workflow to check reusable test caches

name: "Check: Test Caches"

on:
  workflow_call:

# Set default permissions
permissions:
  contents: read

# Set default env vars
env:
  RUSTFLAGS: "-C instrument-coverage -A warnings"
  LLVM_PROFILE_FILE: "stacks-core-%p-%m.profraw"

jobs:
  # Check existing caches
  check-existing-caches:
    name: Check Existing Caches
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      #   - only .github is required for checking caches
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Check cache for bitcoin binary
      - name: Check Bitcoin Cache
        id: bitcoin
        uses: ./.github/actions/cache/bitcoin

      # Check cache for cargo binaries
      - name: Check Cargo Cache
        id: cargo
        uses: ./.github/actions/cache/cargo

      # Output a job summary of cache status and crash the CI run if a cache is missing
      - name: Output GitHub Job Summary
        shell: bash
        env:
          BITCOIN_KEY: ${{ steps.bitcoin.outputs.cache-key }}
          BITCOIN_MATCHED_KEY: ${{ steps.bitcoin.outputs.cache-matched-key }}
          CARGO_KEY: ${{ steps.cargo.outputs.cache-key }}
          CARGO_MATCHED_KEY: ${{ steps.cargo.outputs.cache-matched-key }}
        run: |
          BITCOIN_EMOJI="❌"
          [ -n "$BITCOIN_MATCHED_KEY" ] && BITCOIN_EMOJI="✅"
          CARGO_EMOJI="❌"
          [ -n "$CARGO_MATCHED_KEY" ] && CARGO_EMOJI="✅"

          echo "## Cache Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Cache | Cache Key | Matched Cache Key | Exists? |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bitcoin | $BITCOIN_KEY | ${BITCOIN_MATCHED_KEY:-❌} | $BITCOIN_EMOJI |" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo | $CARGO_KEY | ${CARGO_MATCHED_KEY:-❌} | $CARGO_EMOJI |" >> $GITHUB_STEP_SUMMARY

          # Fail the build gracefully if any cache is missing
          if [ -z "$BITCOIN_MATCHED_KEY" ] || [ -z "$CARGO_MATCHED_KEY" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Required Cache Missing:** A required cache (Bitcoin or Cargo) was not found. This state should be rare. Re-run this action AFTER manually creating the caches from main branch: https://github.com/stacks-network/stacks-core/actions/workflows/create-test-caches.yml" >> $GITHUB_STEP_SUMMARY
            echo "::error title=Required Cache Missing::A required cache (Bitcoin or Cargo) was not found. This state should be rare. Re-run this action AFTER manually creating the caches from main branch: https://github.com/stacks-network/stacks-core/actions/workflows/create-test-caches.yml"
            exit 1
          fi
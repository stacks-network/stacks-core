name: Slack Open PR Nag Bot

on:
  schedule:
    # Run at 6am Eastern Time on Mon, Weds, Fri
    - cron: '0 6 * * 1,3,5'
      timezone: 'America/New_York'
  workflow_dispatch: # Allows manual testing

permissions:
  pull-requests: read

jobs:
  # Check if CI is enabled
  check-ci:
    name: "Check: CI Enabled"
    uses: ./.github/workflows/__check-ci.yml
    with:
      allow-fork-runs: false

  nag-slack:
    name: "Slack: Nag Team"
    needs:
      - check-ci
    if: >-
      needs.check-ci.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PRs and Post Nags to Console / GitHub Summary
        uses: $/.github/wrappers/github-script
        env:
          # CONFIGURABLE VARIABLES
          TARGET_OWNER: 'stacks-network'
          TARGET_REPO: 'stacks-core'
          IGNORE_DRAFTS: 'true'
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          
          # CENTRAL TEAM REGISTRY
          TEAM_REGISTRY: |
            {
              "aaronb-stacks":     { "name": "Aaron",     "slack": "U067F1SRYT0", "triage": true  },
              "adriano-stacks":    { "name": "Adriano",   "slack": "U07CAH5D38Q", "triage": false },
              "benjamin-stacks":   { "name": "Benjamin",  "slack": "U09N5BM0SGP", "triage": true  },
              "brice-stacks":      { "name": "Brice",     "slack": "U067BVCJE30", "triage": true  },
              "cylewitruk-stacks": { "name": "Cyle",      "slack": "U06815BCSB0", "triage": true  },
              "dhaney-stacks":     { "name": "David",     "slack": "U09538PV0RZ", "triage": false },
              "djordon-stacks":    { "name": "Daniel",    "slack": "U07GRAS4X42", "triage": false },
              "federico-stacks":   { "name": "Federico",  "slack": "U08ASJ1LKEV", "triage": true  },
              "francesco-stacks":  { "name": "Francesco", "slack": "U07MCETKTKN", "triage": true  },
              "hstove-stacks":     { "name": "Hank",      "slack": "U068W8VBSQM", "triage": true  },
              "rob-stacks":        { "name": "Roberto",   "slack": "U07UNFAS4BD", "triage": true  },
              "simone-stacks":     { "name": "Simone",    "slack": "U09NA1TP8PK", "triage": false }
            }
          # ------------------------------
          
        with:
          script: |
            const owner = process.env.TARGET_OWNER;
            const repo = process.env.TARGET_REPO;
            const ignoreDrafts = process.env.IGNORE_DRAFTS === 'true';
            const manualRun = process.env.MANUAL_RUN === 'true';

            // 1. Parse the team registry safely
            let registry = {};
            try {
              const rawRegistry = JSON.parse(process.env.TEAM_REGISTRY || '{}');
              registry = Object.fromEntries(Object.entries(rawRegistry).map(([k, v]) => [k.toLowerCase(), v]));
            } catch (e) {
              core.setFailed('Error parsing TEAM_REGISTRY JSON object.');
              return;
            }

            const allowedUsers = new Set(Object.keys(registry));
            const triagerPool = Object.keys(registry)
              .filter(login => registry[login]?.triage !== false)
              .sort();

            const getSlackMention = (githubUsername, ping = true) => {
              const entry = registry[githubUsername.toLowerCase()];
              if (ping && entry?.slack) {
                return `<@${entry.slack}>`;
              }
              if (entry?.name) {
                return entry.name;
              }
              return githubUsername.charAt(0).toUpperCase() + githubUsername.slice(1);
            };

            const sanitizeTitle = (title) => {
              return title
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\|/g, '—');
            };

            // 2. Fetch open Pull Requests
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });

            const filteredSortedPrs = prs
              .filter(pr => !(ignoreDrafts && pr.draft));

            if (filteredSortedPrs.length === 0) {
              console.log('No open PRs found.');
              return;
            }

            // 3. Enrich PR data
            console.log(`Enriching ${filteredSortedPrs.length} PRs...`);
            
            const reviewsGroup = await Promise.all(filteredSortedPrs.map(async (pr) => {
              let unresolvedComments = [];
              let allReviewersSuperset = [];
              const reviewerStateMap = {};
              let approvedCount = 0;
              let mergeableState = 'UNKNOWN';
              let mergeStateStatus = 'UNKNOWN';
            
              try {
                const gqlResponse = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        mergeable
                        mergeStateStatus
                        reviewThreads(first: 50) {
                          nodes {
                            isResolved
                            comments(first: 1) {
                              nodes {
                                author { login }
                                body
                              }
                            }
                          }
                        }
                        reviewRequests(first: 50) {
                          nodes {
                            requestedReviewer {
                              ... on User {
                                login
                              }
                            }
                          }
                        }
                        latestReviews(first: 50) {
                          nodes {
                            author {
                              login
                            }
                            state
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, number: pr.number });
            
                const prNode = gqlResponse.repository?.pullRequest;
                mergeableState = prNode?.mergeable || 'UNKNOWN';
                mergeStateStatus = prNode?.mergeStateStatus || 'UNKNOWN';
            
                const threads = prNode?.reviewThreads?.nodes || [];
                unresolvedComments = threads
                  .filter(thread => !thread.isResolved)
                  .map(thread => {
                    const topComment = thread.comments?.nodes[0];
                    return {
                      commenter: topComment?.author?.login || 'unknown',
                      text_snippet: topComment?.body ? topComment.body.substring(0, 100).replace(/\r?\n|\r/g, " ") : ""
                    };
                  });
            
                const latestReviewsNodes = prNode?.latestReviews?.nodes || [];
                latestReviewsNodes.forEach(node => {
                  if (node.author?.login) {
                    const login = node.author.login.toLowerCase();
                    reviewerStateMap[login] = node.state;
                    if (node.state === 'APPROVED') {
                      approvedCount++;
                    }
                  }
                });
            
                const pendingLogins = prNode?.reviewRequests?.nodes
                  ?.map(node => node.requestedReviewer?.login)
                  .filter(Boolean) || [];
                  
                pendingLogins.forEach(login => {
                  reviewerStateMap[login.toLowerCase()] = 'AWAITING_REVIEW';
                });
            
                allReviewersSuperset = Object.keys(reviewerStateMap)
                  .filter(login => login !== 'copilot-pull-request-reviewer');
            
              } catch (err) {
                console.error(`Failed to fetch GraphQL data for PR #${pr.number}:`, err);
                allReviewersSuperset = pr.requested_reviewers
                  .map(r => r.login)
                  .filter(login => login.toLowerCase() !== 'copilot-pull-request-reviewer');
                  
                allReviewersSuperset.forEach(login => {
                  reviewerStateMap[login.toLowerCase()] = 'AWAITING_REVIEW';
                });
              }
            
              pr.unresolved_comment_threads = unresolvedComments;
              pr.requested_reviewers = allReviewersSuperset.map(login => ({
                login,
                state: reviewerStateMap[login.toLowerCase()] || 'AWAITING_REVIEW'
              }));
              pr.merge_conflict_present = mergeableState === 'CONFLICTING';
              pr.out_of_date_with_base = mergeStateStatus === 'BEHIND';
            
              // 4. Classify PRs
              let explanation = '';
              let sortWeight = 7;
              let statusIcon = '👀';

              const changesRequested = pr.requested_reviewers
                .some(r => r.state === 'CHANGES_REQUESTED');
              const resolveCount = unresolvedComments.length;

              const isExternal = !allowedUsers.has(pr.user.login.toLowerCase());
              const needsTriage = isExternal && (pr.assignees || []).length === 0;

              if (needsTriage) {
                const triager = triagerPool.length > 0
                  ? getSlackMention(triagerPool[pr.number % triagerPool.length], true)
                  : 'Someone';
                explanation = `External PR — ${triager} to triage (assign yourself/someone + request reviewers)`;
                sortWeight = -1;
                statusIcon = '🆕';
              } else if (changesRequested) {
                explanation = `Changes requested`;
                sortWeight = 1;
                statusIcon = '🛑';
              } else if (resolveCount > 0) {
                explanation = `${resolveCount} ${resolveCount === 1 ? 'comment' : 'comments'} to resolve`;
                sortWeight = 2;
                statusIcon = '💬';
              } else if (pr.merge_conflict_present) {
                explanation = `Needs merge conflicts fixed`;
                sortWeight = 3;
                statusIcon = '⚠️';
              } else if (pr.out_of_date_with_base) {
                explanation = `Needs rebase/merge`;
                sortWeight = 4;
                statusIcon = '⏩';
              } else if (approvedCount >= 2) {
                explanation = `Ready for merge`;
                sortWeight = 0;
                statusIcon = '✅';
              } else if (allReviewersSuperset.length === 0) {
                explanation = `Needs reviewers assigned`;
                sortWeight = 6;
                statusIcon = '👥';
              } else {
                explanation = `Needs reviews`;
                sortWeight = 5;
                statusIcon = '⏳';
              }
            
              return { pr, explanation, sortWeight, statusIcon };
            }));

            // 5. Priority Sort Engine
            reviewsGroup.sort((a, b) => {
              if (a.sortWeight !== b.sortWeight) {
                return a.sortWeight - b.sortWeight;
              }

              const authorA = getSlackMention(a.pr.user.login, false).toLowerCase();
              const authorB = getSlackMention(b.pr.user.login, false).toLowerCase();
              if (authorA !== authorB) {
                return authorA.localeCompare(authorB);
              }
              return new Date(a.pr.created_at) - new Date(b.pr.created_at);
            });

            // 6. Map PRs to Action Takers
            const userPrMap = new Map();

            for (const item of reviewsGroup) {
              const pr = item.pr;
              const actionTakers = new Set();

              const isExternal = !allowedUsers.has(pr.user.login.toLowerCase());
              const needsTriage = isExternal && (pr.assignees || []).length === 0;

              if (needsTriage) {
                if (triagerPool.length > 0) {
                  const triagerLogin = triagerPool[pr.number % triagerPool.length].toLowerCase();
                  actionTakers.add(triagerLogin);
                }
              } else {
                pr.requested_reviewers.forEach(r => {
                  if (r.state === 'AWAITING_REVIEW') {
                    actionTakers.add(r.login.toLowerCase());
                  }
                });

                const changesRequested = pr.requested_reviewers.some(r => r.state === 'CHANGES_REQUESTED');
                const resolveCount = pr.unresolved_comment_threads ? pr.unresolved_comment_threads.length : 0;
                const isAuthorAction = changesRequested ||
                  resolveCount > 0 ||
                  pr.merge_conflict_present ||
                  pr.out_of_date_with_base ||
                  item.explanation === 'Ready for merge' ||
                  pr.requested_reviewers.length === 0;

                if (isAuthorAction) {
                  if (pr.assignees && pr.assignees.length > 0) {
                    pr.assignees.forEach(a => actionTakers.add(a.login.toLowerCase()));
                  } else {
                    actionTakers.add(pr.user.login.toLowerCase());
                  }
                }
              }

              if (actionTakers.size === 0) {
                if (pr.assignees && pr.assignees.length > 0) {
                  pr.assignees.forEach(a => actionTakers.add(a.login.toLowerCase()));
                } else {
                  actionTakers.add(pr.user.login.toLowerCase());
                }
              }

              actionTakers.forEach(login => {
                // Only create group sections for users in the registry
                if (!allowedUsers.has(login)) return;

                if (!userPrMap.has(login)) {
                  userPrMap.set(login, []);
                }
                userPrMap.get(login).push(item);
              });
            }

            const sortedLogins = Array.from(userPrMap.keys()).sort((a, b) => {
              const nameA = getSlackMention(a, false).toLowerCase();
              const nameB = getSlackMention(b, false).toLowerCase();
              return nameA.localeCompare(nameB);
            });

            // 7. Build Output Buffer
            const buildPrLine = (item) => {
              const pr = item.pr;
              const author = getSlackMention(pr.user.login, false);
              const title = sanitizeTitle(pr.title);
            
              const getPlainName = (login) => {
                const clean = login.toLowerCase();
                if (registry[clean]?.name) return registry[clean].name;
                const base = clean.replace('-stacks', '');
                return base.charAt(0).toUpperCase() + base.slice(1);
              };
            
              const reviewers = pr.requested_reviewers
                .slice()
                .sort((a, b) => getPlainName(a.login).localeCompare(getPlainName(b.login)))
                .map(r => {
                  const shouldPing = r.state !== 'APPROVED';
                  const name = getSlackMention(r.login, shouldPing);
                  
                  switch (r.state) {
                    case 'APPROVED':
                      return `${name} ✅`;
                    case 'CHANGES_REQUESTED':
                      return `${name} 🛑`;
                    case 'COMMENTED':
                      return `${name} 💬`;
                    case 'AWAITING_REVIEW':
                    default:
                      return `${name} ⏳`;
                  }
                }).join(', ') || 'Anyone';
              
              let line = `\`${item.statusIcon} ${author}\` <${pr.html_url}|${title}> (\`${reviewers}\`)`;
              if (item.explanation) {
                line += ` _${item.explanation}_`;
              }
              return line;
            };

            let currentLines = [];
            const flushLines = () => {
              if (currentLines.length > 0) {
                payload.blocks.push({
                  type: 'section',
                  text: { type: 'mrkdwn', text: currentLines.join('\n') }
                });
                currentLines = [];
              }
            };

            for (const login of sortedLogins) {
              const userItems = userPrMap.get(login);
              if (!userItems || userItems.length === 0) continue;

              currentLines.push(`*${getSlackMention(login, true)}*`);
              for (const item of userItems) {
                currentLines.push(buildPrLine(item));
              }
              currentLines.push(''); // Spacing between user groups

              if (currentLines.length >= 18) {
                flushLines();
              }
            }
            flushLines();

            // 8. Send payload via Webhook
            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              core.setFailed(`Slack API responded with status ${response.status}`);
            } else {
              console.log(`Successfully posted PR Nag to Slack.`);
            }

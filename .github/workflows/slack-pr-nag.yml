name: Slack Open PR Nag Bot

on:
  schedule:
    # Run at 6am Eastern Time on Mon, Weds, Fri
    - cron: '0 6 * * 1,3,5'
      timezone: 'America/New_York'
  workflow_dispatch: # Allows manual testing

permissions:
  pull-requests: read

jobs:
  # Check if CI is enabled
  check-ci:
    name: "Check: CI Enabled"
    uses: ./.github/workflows/__check-ci.yml
    with:
      allow-fork-runs: false

  # Execute only on our official repo, because it manages Slack PR nags for us
  nag-slack:
    name: "Slack: Nag Team"
    needs:
      - check-ci
    if: >-
      needs.check-ci.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PRs and Post Nags to Slack
        uses: $/.github/wrappers/github-script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_CORE_PR_NAG_BOT }}
          
          # CONFIGURABLE VARIABLES
          TARGET_OWNER: 'stacks-network'
          TARGET_REPO: 'stacks-core'
          IGNORE_DRAFTS: 'true'
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          
          # CENTRAL TEAM REGISTRY
          # Membership in this registry is what marks a PR author as internal;
          # anyone absent from it is treated as an external contributor.
          #   name   : display name (Slack mention fallback + sort key)
          #   slack  : Slack member ID, enables an actual @-mention
          #   triage : whether this member takes part in the external-PR
          #            triage rotation (omitted is treated as true)
          TEAM_REGISTRY: |
            {
              "aaronb-stacks":     { "name": "Aaron",     "slack": "U067F1SRYT0", "triage": true  },
              "adriano-stacks":    { "name": "Adriano",   "slack": "U07CAH5D38Q", "triage": false },
              "benjamin-stacks":   { "name": "Benjamin",  "slack": "U09N5BM0SGP", "triage": true  },
              "brice-stacks":      { "name": "Brice",     "slack": "U067BVCJE30", "triage": true  },
              "cylewitruk-stacks": { "name": "Cyle",      "slack": "U06815BCSB0", "triage": true  },
              "dhaney-stacks":     { "name": "David",     "slack": "U09538PV0RZ", "triage": false },
              "djordon-stacks":    { "name": "Daniel",    "slack": "U07GRAS4X42", "triage": false },
              "federico-stacks":   { "name": "Federico",  "slack": "U08ASJ1LKEV", "triage": true  },
              "francesco-stacks":  { "name": "Francesco", "slack": "U07MCETKTKN", "triage": true  },
              "hstove-stacks":     { "name": "Hank",      "slack": "U068W8VBSQM", "triage": true  },
              "rob-stacks":        { "name": "Roberto",   "slack": "U07UNFAS4BD", "triage": true  },
              "simone-stacks":     { "name": "Simone",    "slack": "U09NA1TP8PK", "triage": false }
            }
          # ------------------------------
          
        with:
          script: |
            const owner = process.env.TARGET_OWNER;
            const repo = process.env.TARGET_REPO;
            const ignoreDrafts = process.env.IGNORE_DRAFTS === 'true';
            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            const manualRun = process.env.MANUAL_RUN === 'true';

            if (!webhookUrl) {
              core.setFailed('Missing SLACK_WEBHOOK_URL secret.');
              return;
            }

            // 1. Parse the team registry safely
            let registry = {};
            try {
              const rawRegistry = JSON.parse(process.env.TEAM_REGISTRY || '{}');
              registry = Object.fromEntries(Object.entries(rawRegistry).map(([k, v]) => [k.toLowerCase(), v]));
            } catch (e) {
              core.setFailed('Error parsing TEAM_REGISTRY JSON object.');
              return;
            }

            // Team membership marks a PR author as internal.
            const allowedUsers = new Set(Object.keys(registry));
            // Triage rotation is an opt-out subset of the team.
            const triagerPool = Object.keys(registry)
              .filter(login => registry[login]?.triage !== false)
              .sort();

            // Helper to get Slack mention or display name
            const getSlackMention = (githubUsername) => {
              const entry = registry[githubUsername.toLowerCase()];
              // If we have a Slack ID, return it as a mention
              if (entry?.slack) {
                return `<@${entry.slack}>`;
              }
              // Fallback to display name
              if (entry?.name) {
                return entry.name;
              }
              // Fallback to capitalized login
              return githubUsername.charAt(0).toUpperCase() + githubUsername.slice(1);
            };

            const sanitizeTitle = (title) => {
              return title
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\|/g, '—');
            };

            // 2. Fetch open Pull Requests
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });

            const filteredSortedPrs = prs
              .filter(pr => !(ignoreDrafts && pr.draft));

            if (filteredSortedPrs.length === 0) {
              console.log('No open PRs found.');
              return;
            }

            // 3. Enrich PR data with unresolved review comments and precise reviewer state maps via GraphQL
            console.log(`Enriching ${filteredSortedPrs.length} PRs with merge metrics, comments, and reviewer status tokens...`);
            
            const reviewsGroup = await Promise.all(filteredSortedPrs.map(async (pr) => {
              let unresolvedComments = [];
              let allReviewersSuperset = [];
              const reviewerStateMap = {}; // Maps lowercased login -> state string
              let approvedCount = 0;
              let mergeableState = 'UNKNOWN';
              let mergeStateStatus = 'UNKNOWN';
            
              try {
                const gqlResponse = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        mergeable
                        mergeStateStatus
                        reviewThreads(first: 50) {
                          nodes {
                            isResolved
                            comments(first: 1) {
                              nodes {
                                author { login }
                                body
                              }
                            }
                          }
                        }
                        reviewRequests(first: 50) {
                          nodes {
                            requestedReviewer {
                              ... on User {
                                login
                              }
                            }
                          }
                        }
                        latestReviews(first: 50) {
                          nodes {
                            author {
                              login
                            }
                            state
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, number: pr.number });
            
                const prNode = gqlResponse.repository?.pullRequest;
                mergeableState = prNode?.mergeable || 'UNKNOWN';
                mergeStateStatus = prNode?.mergeStateStatus || 'UNKNOWN';
            
                // Process unresolved comments
                const threads = prNode?.reviewThreads?.nodes || [];
                unresolvedComments = threads
                  .filter(thread => !thread.isResolved)
                  .map(thread => {
                    const topComment = thread.comments?.nodes[0];
                    return {
                      commenter: topComment?.author?.login || 'unknown',
                      text_snippet: topComment?.body ? topComment.body.substring(0, 100).replace(/\r?\n|\r/g, " ") : ""
                    };
                  });
            
                // Populate historical review statuses (APPROVED, CHANGES_REQUESTED, COMMENTED)
                const latestReviewsNodes = prNode?.latestReviews?.nodes || [];
                latestReviewsNodes.forEach(node => {
                  if (node.author?.login) {
                    const login = node.author.login.toLowerCase();
                    reviewerStateMap[login] = node.state; // e.g., 'APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'
                    if (node.state === 'APPROVED') {
                      approvedCount++;
                    }
                  }
                });
            
                // Extract active pending reviewers and overwrite map state to 'AWAITING_REVIEW'
                const pendingLogins = prNode?.reviewRequests?.nodes
                  ?.map(node => node.requestedReviewer?.login)
                  .filter(Boolean) || [];
                  
                pendingLogins.forEach(login => {
                  reviewerStateMap[login.toLowerCase()] = 'AWAITING_REVIEW';
                });
            
                // Deduplicate all unique reviewer handles and filter out Copilot
                allReviewersSuperset = Object.keys(reviewerStateMap)
                  .filter(login => login !== 'copilot-pull-request-reviewer');
            
              } catch (err) {
                console.error(`Failed to fetch GraphQL data for PR #${pr.number}:`, err);
                allReviewersSuperset = pr.requested_reviewers
                  .map(r => r.login)
                  .filter(login => login.toLowerCase() !== 'copilot-pull-request-reviewer');
                  
                allReviewersSuperset.forEach(login => {
                  reviewerStateMap[login.toLowerCase()] = 'AWAITING_REVIEW';
                });
              }
            
              // Package structural models back up for the line builder to scan
              pr.requested_reviewers = allReviewersSuperset.map(login => ({
                login,
                state: reviewerStateMap[login.toLowerCase()] || 'AWAITING_REVIEW'
              }));
              pr.merge_conflict_present = mergeableState === 'CONFLICTING';
              pr.out_of_date_with_base = mergeStateStatus === 'BEHIND';
            
              return { pr, unresolvedComments, approvedCount, allReviewersSuperset };
            }));

            // 4. Action Extraction Engine (Group by User)
            const userActionsMap = {}; // login -> { mention, actions: [] }
            const actionablePrs = new Set();

            const addAction = (login, actionText, prNumber) => {
              const cleanLogin = login.toLowerCase();
              if (!userActionsMap[cleanLogin]) {
                userActionsMap[cleanLogin] = {
                  mention: getSlackMention(cleanLogin),
                  actions: []
                };
              }
              userActionsMap[cleanLogin].actions.push(actionText);
              if (prNumber) actionablePrs.add(prNumber);
            };

            for (const item of reviewsGroup) {
              const pr = item.pr;
              const link = `<${pr.html_url}|${sanitizeTitle(pr.title)}>`;
              const changesRequested = pr.requested_reviewers.some(r => r.state === 'CHANGES_REQUESTED');
              const resolveCount = item.unresolvedComments.length;
              const authorLogin = pr.user.login.toLowerCase();
              
              const isExternal = !allowedUsers.has(authorLogin);
              const needsTriage = isExternal && (pr.assignees || []).length === 0;

              if (needsTriage) {
                const triagerLogin = triagerPool.length > 0 
                  ? triagerPool[pr.number % triagerPool.length] 
                  : null;
                if (triagerLogin) {
                  addAction(triagerLogin, `🆕 External PR to triage: ${link}`, pr.number);
                }
              }

              // Assign whomever owns the next step: the author on internal PRs, the assignee(s) on external ones.
              // An unassigned external PR has no owner here - the triage branch above already nagged the rotation.
              const owners = isExternal ? (pr.assignees || []).map(a => a.login.toLowerCase()) : [authorLogin];
              // A review already sitting in someone's queue is not the owner's problem.
              const someoneOwesReview = pr.requested_reviewers.some(r => r.state === 'AWAITING_REVIEW');
              for (const ownerLogin of owners) {
                if (changesRequested) {
                  addAction(ownerLogin, `🛑 Changes requested: ${link}`);
                } else if (resolveCount > 0) {
                  addAction(ownerLogin, `💬 ${resolveCount} ${resolveCount === 1 ? 'comment' : 'comments'} to resolve: ${link}`);
                } else if (pr.merge_conflict_present) {
                  addAction(ownerLogin, `⚠️ Needs merge conflicts fixed: ${link}`);
                } else if (pr.out_of_date_with_base) {
                  addAction(ownerLogin, `⏩ Needs rebase/merge: ${link}`);
                } else if (item.approvedCount >= 2) {
                  addAction(ownerLogin, `✅ Ready for merge: ${link}`);
                } else if (item.allReviewersSuperset.length === 0) {
                  addAction(ownerLogin, `👥 Needs reviewers assigned: ${link}`);
                } else if (!someoneOwesReview) {
                  addAction(ownerLogin, `⏳ Need reviews: ${link}`);
                }
              }

              // Reviewer actions
              pr.requested_reviewers.forEach(r => {
                // Skip if they already approved OR if they are an external user
                if (r.state === 'APPROVED' || !allowedUsers.has(r.login.toLowerCase())) return;
                
                if (r.state === 'AWAITING_REVIEW') {
                  addAction(r.login, `⏳ Need to review: ${link}`, pr.number);
                }
              });
            }

            // Helper to extract the plain display name for consistent sorting
            const getPlainName = (login) => {
              const clean = login.toLowerCase();
              if (registry[clean]?.name) return registry[clean].name;
              const base = clean.replace('-stacks', '');
              return base.charAt(0).toUpperCase() + base.slice(1);
            };

            // 5. Construct Slack payload blocks
            const payload = { blocks: [] };
            payload.blocks.push({
              type: 'section',
              text: {
                type: 'mrkdwn',
                text: `*📋 Open PR Status Report (${actionablePrs.size} Actionable PRs)*${manualRun ? ' | _(Manual Run)_' : ''}\n`
              }
            });
            
            // Sort users alphabetically by display name
            const sortedLogins = Object.keys(userActionsMap).sort((a, b) => {
              return getPlainName(a).localeCompare(getPlainName(b));
            });

            for (const login of sortedLogins) {
              const userData = userActionsMap[login];
              if (userData.actions.length === 0) continue;
              
              let actionText = userData.mention;
              for (const action of userData.actions) {
                const candidate = `${actionText}\n${action}`;
                if (candidate.length > 2900) {
                  payload.blocks.push({
                    type: 'section',
                    text: { type: 'mrkdwn', text: actionText }
                  });
                  actionText = action;
                } else {
                  actionText = candidate;
                }
              }
              
              payload.blocks.push({
                type: 'section',
                text: { type: 'mrkdwn', text: actionText }
              });
            }

            if (sortedLogins.length === 0) {
              payload.blocks.push({
                type: 'section',
                text: { type: 'mrkdwn', text: "_All caught up! No actions required._" }
              });
            }

            // 6. Send payload via Webhook
            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              core.setFailed(`Slack API responded with status ${response.status}`);
            } else {
              console.log(`Successfully posted PR Nags to Slack.`);
            }

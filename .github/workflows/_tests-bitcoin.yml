# Github workflow to run bitcoin tests in multiple github matrices

name: "Tests: Bitcoin"

on:
  workflow_call:
    inputs:
      archive-file:
        description: "The test archive file"
        required: true
        type: string
      archive-artifact-name:
        description: "Artifact containing the test archive"
        required: true
        type: string
      test-list-artifact-name:
        description: "Artifact containing the nextest test manifest"
        required: true
        type: string
      debug-binary-path:
        description: "Debug binary path"
        required: true
        type: string
      upload-junit-xml:
        description: "Whether or not to upload the nextest JUnit XML artifact"
        required: true
        type: string
      upload-code-coverage:
        description: "Whether to upload each job's code coverage to Coveralls"
        required: true
        type: string

# Set default permissions
permissions:
  contents: read

# Set default env vars
#   - transferred to composite action steps
env:
  BITCOIND_TEST: 1
  # Docker tag for the Bitcoin Core image used when spinning up container with `testcontainers` crate.
  BITCOIN_IMAGE_TAG: "25"
  # The shared signer harness runs bitcoind in a per-test container. Other
  # functional tests use slot-namespaced native bitcoind ports.
  BITCOIN_TESTCONTAINERS: 1
  RUST_BACKTRACE: full
  TEST_TIMEOUT: 30
  TEST_TAG_CI_SKIP: ci_skip
  BITCOIN_TEST_THREADS: 2
  SIGNER_TEST_THREADS_REQUIRED: 1
  # Full-runner tests run in dedicated matrix jobs below. Keeping the names in
  # one variable also guarantees the generated batches exclude the same tests.
  BITCOIN_ISOLATED_TESTS: >-
    tests::signer::v0::signer_multinode_rollover,
    tests::signer::v0::tx_replay::tx_replay_forking_test,
    tests::signer::v0::epoch_4_0_waterfall::epoch_4_0_block_commit_uses_single_sbtc_output::t::slow::bitcoind::t,
    tests::signer::v0::reorg::partial_tenure_fork,
    tests::signer::v0::block_validation_check_rejection_timeout_heuristic,
    tests::signer::v0::tenure_extend::tenure_extend_after_idle_miner
  # Four-test batches limit the impact of runtime variance on the workflow
  # critical path. Additions and removals still adjust runner usage automatically.
  BATCH_SIZE: 4

# Configure concurrency
concurrency:
  group: bitcoin-tests-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Generate list of tests to run
  #  - split into batched matrices of size BATCH_SIZE defined in the env var above (via .github/scripts/bitcoin_tests.sh)
  generate-tests:
    name: Generate Batched Test Matrix
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set-matrix.outputs.batches }}
    steps:
      # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Matrix generation only needs the test manifest produced from the
      # archive. Avoid downloading the archive and debug binaries here.
      - name: Restore Nextest Test List Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.test-list-artifact-name }}

      # Generate the bitcoin test matrices json used for running tests
      - name: Generate Test Matrices
        id: set-matrix
        env:
          NEXTEST_LIST_FILE: nextest-test-list.json
        run: bash ./.github/scripts/bitcoin_tests.sh

  # These tests reserve the full nextest runner. Dedicated jobs prevent their
  # exclusive phases from serializing otherwise-parallel tests in a batch.
  isolated-integration-tests:
    name: Isolated Integration Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: signer-multinode-rollover
            test-names: tests::signer::v0::signer_multinode_rollover
          - label: tx-replay-forking
            test-names: tests::signer::v0::tx_replay::tx_replay_forking_test
          - label: epoch-4-waterfall
            test-names: tests::signer::v0::epoch_4_0_waterfall::epoch_4_0_block_commit_uses_single_sbtc_output::t::slow::bitcoind::t
          - label: partial-tenure-fork
            test-names: tests::signer::v0::reorg::partial_tenure_fork
          # Pair two short exclusive tests in one sequential job. This keeps
          # them off shared batches without consuming another runner slot.
          - label: block-validation-and-idle-miner
            test-names: >-
              tests::signer::v0::block_validation_check_rejection_timeout_heuristic,
              tests::signer::v0::tenure_extend::tenure_extend_after_idle_miner
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      - name: Setup + Run Tests + Codecov
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
        uses: ./.github/actions/run-tests
        with:
          test-names: ${{ matrix.test-names }}
          test-threads: "1"
          test-timings-file: .github/test-timings/bitcoin-integration.json
          archive-file: ${{ inputs.archive-file }}
          archive-artifact-name: ${{ inputs.archive-artifact-name }}
          debug-binary-path: ${{ inputs.debug-binary-path }}
          codecov-test-name: isolated-${{ matrix.label }}
          upload-junit-xml: ${{ inputs.upload-junit-xml }}
          upload-code-coverage: ${{ inputs.upload-code-coverage }}

  # Dynamically run one runner per batch generated by the script
  integration-tests:
    name: Integration Tests
    needs:
      - generate-tests
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() &&
      needs.generate-tests.result != 'failure' &&
      needs.generate-tests.outputs.batches != '[]'
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.generate-tests.outputs.batches) }}
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Setup, run tests, generate and upload code coverage artifact
      - name: Setup + Run Tests + Codecov
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
        uses: ./.github/actions/run-tests
        with:
          test-names: ${{ matrix.batch.csv }}
          test-threads: ${{ env.BITCOIN_TEST_THREADS }}
          test-timings-file: .github/test-timings/bitcoin-integration.json
          archive-file: ${{ inputs.archive-file }}
          archive-artifact-name: ${{ inputs.archive-artifact-name }}
          debug-binary-path: ${{ inputs.debug-binary-path }}
          codecov-test-name: batched-integration-tests-${{ matrix.batch.index }}
          upload-junit-xml: ${{ inputs.upload-junit-xml }}
          upload-code-coverage: ${{ inputs.upload-code-coverage }}

  # Check that all jobs in this workflow have succeeded.
  check-tests:
    name: Check Tests
    needs:
      - generate-tests
      - integration-tests
      - isolated-integration-tests
    if: |
      always() && 
      !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Check if all jobs succeeded
      - name: Check Jobs Status
        shell: bash
        env:
          JOBS: ${{ toJson(needs) }}
          SUMMARY_PRINT: "true"
        run: bash ./.github/scripts/check_jobs_status.sh

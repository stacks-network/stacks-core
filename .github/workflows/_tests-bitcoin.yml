# Github workflow to run bitcoin tests in multiple github matrices

name: "Tests: Bitcoin"

on:
  workflow_call:
    inputs:
      archive-file:
        description: "The test archive file"
        required: true
        type: string
      debug-binary-path:
        description: "Debug binary path"
        required: true
        type: string
      upload-junit-xml:
        description: "Whether or not to upload the nextest JUnit XML artifact"
        required: true
        type: string
      upload-code-coverage:
        description: "Whether or not to upload the code coverage artifact"
        required: true
        type: string

# Set default permissions
permissions:
  contents: read

# Set default env vars
#   - transferred to composite action steps
env:
  BITCOIND_TEST: 1
  # Docker tag for the Bitcoin Core image used when spinning up container with `testcontainers` crate.
  BITCOIN_IMAGE_TAG: "25"
  RUST_BACKTRACE: full
  TEST_TIMEOUT: 30
  TEST_TAG_CI_SKIP: ci_skip
  # This should match the number of jobs we use below
  MAX_CHUNKS: 4
  # GitHub Actions have a 256 matrix limit
  MAX_PER_CHUNK: 256

# Configure concurrency
concurrency:
  group: bitcoin-tests-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Generate list of tests to run
  #  - split into multiple matrix batches of MAX_PER_CHUNK size
  generate-tests:
    name: Generate Batched Test Matrix
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      batches_1: ${{ steps.set-matrix.outputs.batches_1 }}
      batches_2: ${{ steps.set-matrix.outputs.batches_2 }}
      batches_3: ${{ steps.set-matrix.outputs.batches_3 }}
      batches_4: ${{ steps.set-matrix.outputs.batches_4 }}
    steps:
      # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Restore Nextest archive artifact
      #   - also provides the nextest binary bundled in the artifact
      - name: Restore Nextest Archive Artifact
        uses: ./.github/actions/artifacts/nextest-archive
        with:
          action: restore
          archive-file: ${{ inputs.archive-file }}
          debug-binary-path: ${{ inputs.debug-binary-path }}

      # Generate the bitcoin test matrices json used for running tests
      - name: Generate Test Matrices
        id: set-matrix
        run: bash ./.github/scripts/bitcoin_tests.sh

  integration-tests-1:
    name: Integration Tests (Partition 1)
    needs: generate-tests
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.generate-tests.result != 'failure' && needs.generate-tests.outputs.batches_1 != '[]'
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.generate-tests.outputs.batches_1) }}
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: .github
      
      # Setup, run tests, generate and upload code coverage artifact
      - name: Setup + Run Tests + Codecov
        uses: ./.github/actions/run-tests
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
        with:
          test-names: ${{ matrix.batch.csv }}
          archive-file: ${{ inputs.archive-file }}
          debug-binary-path: ${{ inputs.debug-binary-path }}
          codecov-test-name: isolated-test-${{ matrix.batch.index }}
          upload-junit-xml: ${{ inputs.upload-junit-xml }}
          upload-code-coverage: ${{ inputs.upload-code-coverage }}

integration-tests-2:
  name: Integration Tests (Partition 2)
  needs: generate-tests
  runs-on: ubuntu-latest
  if: always() && !cancelled() && needs.generate-tests.result != 'failure'
  strategy:
    fail-fast: false
    matrix:
      batch: ${{ needs.generate-tests.outputs.batches_2 == '[]' && fromJSON('[{"is_empty": true}]') || fromJSON(needs.generate-tests.outputs.batches_2) }}
  steps:
    - name: Log Empty Batch
      if: ${{ matrix.batch.is_empty }}
      run: echo "::notice::Partition 2 received an empty batch array. Skipping test run successfully."

    - name: Checkout the latest code
      if: ${{ !matrix.batch.is_empty }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        sparse-checkout: .github
        
    # Setup, run tests, generate and upload code coverage artifact
    - name: Setup + Run Tests + Codecov
      if: ${{ !matrix.batch.is_empty }}
      uses: ./.github/actions/run-tests
      timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
      with:
        test-names: ${{ matrix.batch.csv }}
        archive-file: ${{ inputs.archive-file }}
        debug-binary-path: ${{ inputs.debug-binary-path }}
        codecov-test-name: isolated-test-${{ matrix.batch.index }}
        upload-junit-xml: ${{ inputs.upload-junit-xml }}
        upload-code-coverage: ${{ inputs.upload-code-coverage }}
          
 integration-tests-3:
  name: Integration Tests (Partition 3)
  needs: generate-tests
  runs-on: ubuntu-latest
  if: always() && !cancelled() && needs.generate-tests.result != 'failure'
  strategy:
    fail-fast: false
    matrix:
      batch: ${{ needs.generate-tests.outputs.batches_3 == '[]' && fromJSON('[{"is_empty": true}]') || fromJSON(needs.generate-tests.outputs.batches_3) }}
  steps:
    - name: Log Empty Batch
      if: ${{ matrix.batch.is_empty }}
      run: echo "::notice::Partition 3 received an empty batch array. Skipping test run successfully."

    - name: Checkout the latest code
      if: ${{ !matrix.batch.is_empty }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        sparse-checkout: .github
        
    # Setup, run tests, generate and upload code coverage artifact
    - name: Setup + Run Tests + Codecov
      if: ${{ !matrix.batch.is_empty }}
      uses: ./.github/actions/run-tests
      timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
      with:
        test-names: ${{ matrix.batch.csv }}
        archive-file: ${{ inputs.archive-file }}
        debug-binary-path: ${{ inputs.debug-binary-path }}
        codecov-test-name: isolated-test-${{ matrix.batch.index }}
        upload-junit-xml: ${{ inputs.upload-junit-xml }}
        upload-code-coverage: ${{ inputs.upload-code-coverage }}
          
 integration-tests-4:
  name: Integration Tests (Partition 4)
  needs: generate-tests
  runs-on: ubuntu-latest
  if: always() && !cancelled() && needs.generate-tests.result != 'failure'
  strategy:
    fail-fast: false
    matrix:
      batch: ${{ needs.generate-tests.outputs.batches_4 == '[]' && fromJSON('[{"is_empty": true}]') || fromJSON(needs.generate-tests.outputs.batches_4) }}
  steps:
    - name: Log Empty Batch
      if: ${{ matrix.batch.is_empty }}
      run: echo "::notice::Partition 4 received an empty batch array. Skipping test run successfully."

    - name: Checkout the latest code
      if: ${{ !matrix.batch.is_empty }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        sparse-checkout: .github
        
    # Setup, run tests, generate and upload code coverage artifact
    - name: Setup + Run Tests + Codecov
      if: ${{ !matrix.batch.is_empty }}
      uses: ./.github/actions/run-tests
      timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
      with:
        test-names: ${{ matrix.batch.csv }}
        archive-file: ${{ inputs.archive-file }}
        debug-binary-path: ${{ inputs.debug-binary-path }}
        codecov-test-name: isolated-test-${{ matrix.batch.index }}
        upload-junit-xml: ${{ inputs.upload-junit-xml }}
        upload-code-coverage: ${{ inputs.upload-code-coverage }}

  # Check that all jobs in this workflow have succeeded.
  check-tests:
    name: Check Tests
    needs:
      - generate-tests
      - integration-tests-1
      - integration-tests-2
      - integration-tests-3
      - integration-tests-4
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: .github
          
      # Check if all jobs succeeded
      - name: Check Jobs Status
        shell: bash
        env:
          JOBS: ${{ toJson(needs) }}
          SUMMARY_PRINT: "true"
        run: bash ./.github/scripts/check_jobs_status.sh

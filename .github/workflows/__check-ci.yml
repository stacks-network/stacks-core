# GitHub workflow to check if CI is enabled

name: "Check CI"

on:
  workflow_call:
    outputs:
      enabled:
        description: "Returns 'true' if CI is enabled, 'false' otherwise"
        value: ${{ jobs.check-ci.outputs.enabled }}
      official-repo:
        description: "Returns 'true' if running on stacks-network/stacks-core, 'false' otherwise"
        value: ${{ jobs.check-ci.outputs.official-repo }}

permissions:
  contents: read

jobs:
  check-ci:
    name: "Check CI"
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      official-repo: ${{ steps.check.outputs.official-repo }}
    steps:
      - name: "Check CI Enabled"
        id: check
        shell: bash
        run: |
          echo "=== CI Enablement Check ==="
          echo "ENABLE_CI_WORKFLOWS: '${{ vars.ENABLE_CI_WORKFLOWS }}'"
          echo "github.repository:   '${{ github.repository }}'"
          echo "github.event_name:   '${{ github.event_name }}'"

          IS_ENABLED="false"
          if [[ "${{ vars.ENABLE_CI_WORKFLOWS }}" == "true" || "${{ github.repository }}" == "stacks-network/stacks-core" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Result: CI is ENABLED"
            IS_ENABLED="true"
          else
            echo "Result: CI is DISABLED"
          fi
          
          IS_OFFICIAL_REPO="false"
          if [[ "${{ github.repository }}" == "stacks-network/stacks-core" ]]; then
            IS_OFFICIAL_REPO="true"
          fi

          echo "enabled=${IS_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "official-repo=${IS_OFFICIAL_REPO}" >> "$GITHUB_OUTPUT"

          # Write results to GITHUB_STEP_SUMMARY
          echo "## ⚙️ CI Enablement Check" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`ENABLE_CI_WORKFLOWS\` | \`${{ vars.ENABLE_CI_WORKFLOWS }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`github.repository\` | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`github.event_name\` | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${IS_ENABLED}" == "true" ]]; then
            echo "✅ **Result:** CI is **ENABLED**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Result:** CI is **DISABLED**." >> "$GITHUB_STEP_SUMMARY"
          fi

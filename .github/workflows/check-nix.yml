name: "Checks: Nix"
run-name: "Checks: Nix [${{ github.ref_name }}]"

on:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.yml"
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Set default permissions
permissions:
  contents: read

# Configure concurrency
concurrency:
  group: nix-${{ github.head_ref || github.ref || github.run_id }}
  # Always cancel duplicate jobs
  cancel-in-progress: true

jobs:
  check-ci-enabled:
    name: "Check: CI Enabled"
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          echo "=== CI Enablement Check ==="
          echo "ENABLE_CI_WORKFLOWS: '${{ vars.ENABLE_CI_WORKFLOWS }}'"
          echo "github.repository:   '${{ github.repository }}'"
    
          if [[ "${{ vars.ENABLE_CI_WORKFLOWS }}" == "true" || "${{ github.repository }}" == "stacks-network/stacks-core" ]]; then
            echo "Result: CI is ENABLED"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Result: CI is DISABLED"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build-pkg:
    name: "Check: Nix package"
    needs:
      - check-ci-enabled
    if: needs.check-ci-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Install Nix
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      # Cache Crane's dependency artifact rather than rebuilding it on every
      # ephemeral runner. Source changes remain protected by Nix derivations.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ hashFiles('contrib/nix/**/*.nix', 'contrib/nix/flake.lock', '**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'versions.toml') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      # Run the check
      - name: Check Nix flake
        run: |
          nix flake check ./contrib/nix
          # Preserve only the reusable dependency artifact through the cache
          # action's post-job garbage collection. Retaining the whole build
          # closure would compete with the repository's Cargo caches.
          nix build \
            ./contrib/nix#checks.x86_64-linux.cargoArtifacts \
            --out-link result-nix-dependencies

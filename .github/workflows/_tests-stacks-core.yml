# Github workflow to run full genesis and unit tests

name: "Tests: Stacks Core"

on:
  workflow_call:
    inputs:
      archive-file:
        description: "Archive containing the remaining workspace test binaries"
        required: true
        type: string
      archive-artifact-name:
        description: "Artifact containing the remaining workspace archive"
        required: true
        type: string
      stacks-node-archive-file:
        description: "Archive containing the stacks-node test binary"
        required: true
        type: string
      stacks-node-archive-artifact-name:
        description: "Artifact containing the stacks-node archive"
        required: true
        type: string
      stackslib-archive-file:
        description: "Archive containing the stackslib test binary"
        required: true
        type: string
      stackslib-archive-artifact-name:
        description: "Artifact containing the stackslib archive"
        required: true
        type: string
      debug-binary-path:
        description: "Debug binary path"
        required: true
        type: string
      upload-junit-xml:
        description: "Whether or not to upload the nextest JUnit XML artifact"
        required: true
        type: string
      upload-code-coverage:
        description: "Whether to upload each job's code coverage to Coveralls"
        required: true
        type: string

# Set default permissions
permissions:
  contents: read

# Set default env vars
#   - transferred to composite action steps
env:
  BITCOIND_TEST: 1
  RUST_BACKTRACE: full
  TEST_TIMEOUT: 30
  # Standard GitHub-hosted Linux runners expose four nextest execution slots.
  # Keep this aligned with the ci-parallel profile and unit balancer model.
  UNIT_TEST_THREADS: 4

# Configure concurrency
concurrency:
  group: stacks-core-tests-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Unit tests with code coverage
  unit-tests:
    name: Unit Tests (${{ matrix.suite }} ${{ matrix.partition }}/${{ matrix.total-partitions }})
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # Continue the workflow in case a step fails (ex a single test fails)
    # continue-on-error: true
    strategy:
      # Continue the workflow in case a step fails (ex a single test fails)
      fail-fast: false
      matrix:
        include:
          # Stackslib contains nearly all historically slow general-unit work.
          # Fifteen shards bound runner-wide contention from memory-heavy
          # Clarity cases while keeping each job above its setup overhead.
          - { suite: stackslib, partition: 1, total-partitions: 15 }
          - { suite: stackslib, partition: 2, total-partitions: 15 }
          - { suite: stackslib, partition: 3, total-partitions: 15 }
          - { suite: stackslib, partition: 4, total-partitions: 15 }
          - { suite: stackslib, partition: 5, total-partitions: 15 }
          - { suite: stackslib, partition: 6, total-partitions: 15 }
          - { suite: stackslib, partition: 7, total-partitions: 15 }
          - { suite: stackslib, partition: 8, total-partitions: 15 }
          - { suite: stackslib, partition: 9, total-partitions: 15 }
          - { suite: stackslib, partition: 10, total-partitions: 15 }
          - { suite: stackslib, partition: 11, total-partitions: 15 }
          - { suite: stackslib, partition: 12, total-partitions: 15 }
          - { suite: stackslib, partition: 13, total-partitions: 15 }
          - { suite: stackslib, partition: 14, total-partitions: 15 }
          - { suite: stackslib, partition: 15, total-partitions: 15 }
          - { suite: remaining, partition: 1, total-partitions: 2 }
          - { suite: remaining, partition: 2, total-partitions: 2 }
          - { suite: stacks-node, partition: 1, total-partitions: 1 }
    steps:
    # Checkout the code
    #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Setup, run tests, generate and upload code coverage artifact
      - name: Setup + Run Tests + Codecov
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
        uses: ./.github/actions/run-tests
        with:
          partition: ${{ matrix.partition }}
          total-partitions: ${{ matrix.total-partitions }}
          test-timings-file: .github/test-timings/unit.json
          excluded-test-names: ${{ matrix.suite == 'stackslib' && 'chainstate::tests::parse_tests::test_cost_balance_exceeded,chainstate::tests::runtime_analysis_tests::runtime_check_error_cost_balance_exceeded_ccall' || matrix.suite == 'stacks-node' && 'tests::signer::v0::test_vtxindex_zero_two_miners' || '' }}
          archive-file: ${{ matrix.suite == 'stackslib' && inputs.stackslib-archive-file || matrix.suite == 'stacks-node' && inputs.stacks-node-archive-file || inputs.archive-file }}
          archive-artifact-name: ${{ matrix.suite == 'stackslib' && inputs.stackslib-archive-artifact-name || matrix.suite == 'stacks-node' && inputs.stacks-node-archive-artifact-name || inputs.archive-artifact-name }}
          debug-binary-path: ${{ inputs.debug-binary-path }}
          codecov-test-name: unit-tests-${{ matrix.suite }}-${{ matrix.partition }}
          upload-junit-xml: ${{ inputs.upload-junit-xml }}
          upload-code-coverage: ${{ inputs.upload-code-coverage }}

  # These tests contend heavily with other CPU- and memory-intensive unit tests.
  # Give each one an otherwise-idle runner: serializing them behind one another
  # made their combined runtime the unit workflow's critical path.
  unit-parser-stress-test:
    name: Unit Parser Stress Test (${{ matrix.label }})
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Parse Cost Balance
            suite: stackslib
            artifact-name: parse-cost-balance
            test-name: chainstate::tests::parse_tests::test_cost_balance_exceeded
          - label: Runtime Cost Balance
            suite: stackslib
            artifact-name: runtime-cost-balance
            test-name: chainstate::tests::runtime_analysis_tests::runtime_check_error_cost_balance_exceeded_ccall
          - label: Two Miners
            suite: stacks-node
            artifact-name: two-miners
            test-name: tests::signer::v0::test_vtxindex_zero_two_miners
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      - name: Setup + Run Tests + Codecov
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
        uses: ./.github/actions/run-tests
        with:
          test-names: ${{ matrix.test-name }}
          test-threads: "1"
          archive-file: ${{ matrix.suite == 'stackslib' && inputs.stackslib-archive-file || inputs.stacks-node-archive-file }}
          archive-artifact-name: ${{ matrix.suite == 'stackslib' && inputs.stackslib-archive-artifact-name || inputs.stacks-node-archive-artifact-name }}
          debug-binary-path: ${{ inputs.debug-binary-path }}
          codecov-test-name: unit-parser-stress-${{ matrix.artifact-name }}
          upload-junit-xml: ${{ inputs.upload-junit-xml }}
          upload-code-coverage: ${{ inputs.upload-code-coverage }}

  # Generate and upload openapi html artifact
  open-api-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
    # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Generate OpenAPI documentation
        uses: ./.github/actions/openapi
        with:
          input: "./docs/rpc/openapi.yaml"
          output: "./openapi-docs.html"
          config: "./docs/rpc/redocly.yaml"
          validate: "true"
          redocly-version: "2.19"

  # Generate and upload node configuration documentation
  node-config-docsgen:
    name: Node Configuration Documentation
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Generate Node Configuration Documentation
        uses: ./.github/actions/config-docsgen

  # Core contract tests
  core-contracts-clarinet-test:
    name: Core Contracts Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./contrib/core-contract-tests/"
    steps:
      # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Execute core contract unit tests with clarinet-sdk
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25.x
          package-manager-cache: false # cache is not reusable, do not save anything
      - run: npm ci
      - run: npm test

  # Check that all jobs in this workflow have succeeded.
  #   - will not run if the job is cancelled
  check-tests:
    name: Check Tests
    needs:
      - unit-tests
      - unit-parser-stress-test
      - open-api-validation
      - node-config-docsgen
      - core-contracts-clarinet-test
    if: |
      always() && 
      !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Check if all jobs succeeded
      - name: Check Jobs Status
        shell: bash
        env:
          JOBS: ${{ toJson(needs) }}
          SUMMARY_PRINT: "true"
        run: bash ./.github/scripts/check_jobs_status.sh

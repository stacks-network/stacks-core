############################################################################
### On PR closed as merged to `main`, uploads a code coverage artifact 
### to create the current `main` branch baseline code coverage report
############################################################################

name: "Update `main` Code Coverage"
run-name: "Update `main` Code Coverage: [${{ github.ref_name }}]"

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

# Set default permissions
permissions:
  contents: read
  actions: read # to access artifacts from other actions

# Set default shell
defaults:
  run:
    shell: bash

jobs:
  ############################################################################
  ### Create Code Coverage Report for `main`
  ############################################################################
  create-main-baseline-code-coverage-report:
    # Only run on our core repo, and if the PR was successfully merged
    # (will not run for PRs that were closed without merging)
    if: >-
      github.event.pull_request.merged == true &&
      github.repository == 'stacks-network/stacks-core'
    name: "Create: `main` Baseline Code Coverage Report"
    runs-on: ubuntu-latest
    env:
      MERGED_COVERAGE_REPORT_ARTIFACT_NAME: "merged-code-coverage-report"
      REPORT_FILES_DIR: "code_coverage_files"
      REPORT_FILES_EXT: "info"
    steps:
      # Checkout the code (Coveralls requires source code to be available when action is called)
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
           ref: ${{ github.event.pull_request.merge_commit_sha }}
          
      # Download the merged code coverage file artifact (prefixed by commit SHA)
      - name: Download merged code coverage artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest successful CI workflow run ID for this PR
          RUN_ID=$(gh run list \
            --repo ${{ github.repository }} \
            --commit ${{ github.event.pull_request.head.sha }} \
            --workflow ci.yml \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId')
        
          # Guard against empty/null results
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful CI run found for commit ${{ github.event.pull_request.head.sha }}"
            exit 1
          fi

          # Download the merged code coverage file into $REPORT_FILES_DIR
          echo "Downloading artifact from Run ID: $RUN_ID"
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$MERGED_COVERAGE_REPORT_ARTIFACT_NAME" \
            --dir "$REPORT_FILES_DIR"
          
      # Upload the merged code coverage file to Coveralls for `main` branch
      - name: Upload code coverage to Coveralls for `main` branch
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          files: ${{ env.REPORT_FILES_DIR }}/*.${{ env.REPORT_FILES_EXT }}
          git-branch: main # attribute to main branch
          git-commit: ${{ github.event.pull_request.merge_commit_sha }} # use the merge commit
          build-number: ${{ github.run_id }}-${{ github.run_attempt }} # include run attempt in build so that repeated CI job runs don't cause a "job already closed" error on upload
          fail-on-error: true

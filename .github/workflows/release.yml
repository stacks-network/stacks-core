############################################################################
### Our release CI/CD workflow
############################################################################

name: "Release"
run-name: "Release: [${{ github.ref_name }}]"

on:
  workflow_dispatch: # Allows manual triggering

# Set default permissions for all jobs
permissions:
  contents: read

# Set default shell
defaults:
  run:
    shell: bash

# Configure concurrency
concurrency:
  group: release
  # Never cancel duplicate jobs since we don't want to have orphaned GHCR docker entries etc.
  cancel-in-progress: false

# Env vars
env:
  TEST_ARCHIVE_FILE: "./test_archive.tar.zst"

jobs:
  check-ci-enabled:
    name: "Check: CI Enabled"
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          echo "=== CI Enablement Check ==="
          echo "ENABLE_CI_WORKFLOWS: '${{ vars.ENABLE_CI_WORKFLOWS }}'"
          echo "github.repository:   '${{ github.repository }}'"
    
          if [[ "${{ vars.ENABLE_CI_WORKFLOWS }}" == "true" || "${{ github.repository }}" == "stacks-network/stacks-core" ]]; then
            echo "Result: CI is ENABLED"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Result: CI is DISABLED"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  ############################################################################
  ### Global Variables Setup
  ###
  ### Bridges global env variables to the jobs context so they are safely
  ### accessible by downstream reusable workflows.
  ### Also defines default runs-on anchor.
  ############################################################################
  setup-env:
    name: "Setup: Global Variables"
    needs:
      - check-ci-enabled
    if: needs.check-ci-enabled.outputs.enabled == 'true'
    runs-on: &shared_config ubuntu-latest
    outputs:
      test-archive-file: ${{ steps.set-env.outputs.test_archive_file }}
    steps:
      - name: Export Env Variables
        id: set-env
        run: |
          # Capture the archive file input, then expand the leading ~ to $HOME
          INPUT_FILE="${{ env.TEST_ARCHIVE_FILE }}"
          ARCHIVE_FILE="${INPUT_FILE/#\~/$HOME}"

          echo "test_archive_file=$ARCHIVE_FILE" >> $GITHUB_OUTPUT

  ############################################################################
  ### Release Check
  ###
  ### Checks if this is a release build
  ### If true, will execute release jobs
  ############################################################################
  check-release:
    name: "Check: Release"
    needs:
      - check-ci-enabled
      - setup-env
    # Execute if ENABLE_CI_WORKFLOWS GitHub Actions variable is 'true' or we're on the official repository
    if: vars.ENABLE_CI_WORKFLOWS == 'true' || github.repository == 'stacks-network/stacks-core'
    runs-on: *shared_config
    outputs:
      tag: ${{ steps.check-release.outputs.tag }}
      is_release: ${{ steps.check-release.outputs.is_release }}
    steps:
      # Checkout the code
      #   - only .github and versions.toml are required for this job
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github
            versions.toml

      # Run script to check if this is a release and set outputs
      - name: Check Release
        id: check-release
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash ./.github/scripts/check_release.sh
        
  # If the codebase contains "DO NOT RELEASE", abort the release (and let us know)
  check-do-not-release:
    name: 'Check Codebase for "DO NOT RELEASE"'
    needs:
      - check-release
    if: >-
      needs.check-release.outputs.tag != '' &&
      needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
           
      - name: 'Check for "DO NOT RELEASE" in codebase'
        shell: bash
        run: |
          # Search recursively (-r), with line numbers (-n), skipping binaries (-I) and ignoring .git and .github directories as well as CONTRIBUTING.md
          # This file always has the string "DO NOT RELEASE" in it so the .github folder MUST be skipped or we'll always find this.
          # '|| true' prevents GitHub Action's default 'set -e' from exiting early when grep finds no matches (exit code 1).
          
          FOUND_MATCHES=$(grep -rnI --exclude-dir=.git --exclude-dir=.github --exclude=CONTRIBUTING.md "DO NOT RELEASE" . || true)
          
          if [ -n "$FOUND_MATCHES" ]; then
            {
              echo "### ❌ Release Blocked"
              echo 'Found phrase `"DO NOT RELEASE"` in the following location(s):'
              echo '```text'
              echo "$FOUND_MATCHES"
              echo '```'
              echo 'These instances must be removed before a release can be completed.'
            } >> "$GITHUB_STEP_SUMMARY"
          
            echo "::error::Found 'DO NOT RELEASE' in codebase. Aborting release."
            exit 1
          fi
          
          echo "No 'DO NOT RELEASE' markers found in codebase. Proceeding with release."

  # If there are any open issues or PRs labeled "X.Y.Z-blocker", abort the release (and let us know)
  check-release-blockers:
    name: 'Check for Open "<version>-blocker" Issues/PRs'
    needs:
      - check-release
    if: >-
      needs.check-release.outputs.tag != '' &&
      needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: 'Check for open "<version>-blocker" issues and pull requests'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          # The blocker label is the 3-part version (X.Y.Z) of the release tag, i.e. "4.0.0-blocker".
          # Anything after the 3-part version (i.e. "-rc1", or extra version parts) is ignored.

          if [[ ! "${TAG}" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "::error::Could not determine an X.Y.Z version from the tag '${TAG}'. Aborting release."
            exit 1
          fi
          LABEL="${BASH_REMATCH[1]}-blocker"
          echo "Checking for open issues and pull requests labeled '${LABEL}'"

          # The REST "list repository issues" endpoint returns both issues and pull requests,
          # and returns an empty list (rather than an error) when the label does not exist.
          BLOCKERS=$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/issues" \
            -f state=open \
            -f labels="${LABEL}" \
            -f per_page=100 \
            --jq '.[] | "- [\(if .pull_request then "PR" else "Issue" end) #\(.number)](\(.html_url)): \(.title)"')

          if [ -n "$BLOCKERS" ]; then
            {
              echo "### ❌ Release Blocked"
              echo "Found open issue(s)/pull request(s) labeled \`${LABEL}\`:"
              echo "$BLOCKERS"
              echo ""
              echo 'These must be resolved (or the label removed) before a release can be completed.'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Found open issues/PRs labeled '${LABEL}'. Aborting release."
            exit 1
          fi

          echo "No open issues or pull requests labeled '${LABEL}'. Proceeding with release."

  # Wait for someone to pull the andon cord (as configured in the "Builds Release" GitHub Actions environment)
  andon-cord:
    name: Andon Cord
    needs:
      - check-do-not-release
      - check-release
      - check-release-blockers
    if: >-
      needs.check-release.outputs.tag != '' &&
      needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: release # will pause for approval
    steps:
      - name: Check Approval
        run: |
          exit 0

  ############################################################################
  ### Check Reusable Test Caches
  ###
  ### Caches can only be created from `main`. The workflow will fail
  ### if caches are missing, with instructions on how to manually seed them.
  ############################################################################
  check-test-caches:
    name: "Check: Test Caches"
    needs:
      - andon-cord
    uses: ./.github/workflows/_check-test-caches.yml

  ############################################################################
  ### Create Nextest Archive Artifact for Tests
  ############################################################################
  create-nextest-archive:
    name: "Create: Nextest Archive Artifact"
    runs-on: *shared_config
    needs:
      - check-test-caches
      - setup-env
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Create Nextest archive artifact
      - name: Create Nextest Archive Artifact
        uses: ./.github/actions/artifacts/nextest-archive
        with:
          action: create
          archive-file: ${{ needs.setup-env.outputs.test-archive-file }}

  ############################################################################
  ### Run Epoch Tests (Release Only)
  ############################################################################
  tests-epoch:
    name: "Tests: Epoch (Release Only)"
    needs:
      - check-release
      - check-test-caches
      - create-nextest-archive
      - setup-env
    uses: ./.github/workflows/_tests-epoch.yml
    with:
      archive-file: ${{ needs.setup-env.outputs.test-archive-file }}
      upload-junit-xml: "false"
      upload-code-coverage: "false"

  ############################################################################
  ### Create Release
  ###
  ### Creates binary archives for several architectures
  ### Creates Docker images and pushes to ghcr registry
  ### Creates a draft GitHub release
  ############################################################################
  create-release:
    name: "Create: Release"
    needs:
      - check-release
      - tests-epoch
    if: >-
      needs.check-release.outputs.is_release == 'true' &&
      github.event_name != 'merge_group'
    permissions:
      contents: read         # required for github release
      id-token: write        # required for attestation
      attestations: write    # required for attestation
      packages: write        # required for image push to ghcr
      issues: read           # required for release blocker check
      pull-requests: read    # required for release blocker check
    uses: ./.github/workflows/_release-github.yml
    secrets:                 # required for secrets to be available to this workflow
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      tag: ${{ needs.check-release.outputs.tag }} # 3-part version shared by the node and signer, like 4.0.0

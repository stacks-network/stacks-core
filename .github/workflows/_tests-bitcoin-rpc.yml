# Github workflow to run bitcoin RPC tests over multiple versions of Bitcoin Core

name: "Tests: Bitcoin RPC"

on:
  workflow_call:
    inputs:
      archive-file:
        description: "The test archive file"
        required: true
        type: string
# Set default permissions
permissions:
  contents: read

# Set default env vars
env:
  RUST_BACKTRACE: full
  TEST_TIMEOUT_MINS: 60
  IMAGE_PULL_TIMEOUT_MINS: 5
  PER_VERSION_TEST_TIMEOUT_MINS: 5
  DISCOVER_TIMEOUT_MINS: 5
  # Minimum Bitcoin Core major version to start discovering Docker tags from.
  START_MAJOR: "25"

# Configure concurrency
concurrency:
  group: bitcoin-rpc-tests-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover-bitcoin-majors:
    name: Discover Bitcoin Majors
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      # Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Run script to get a list of docker bitcoin versions
      - name: Discover available Bitcoin major tags on dockerhub
        id: discover
        timeout-minutes: ${{ fromJSON(env.DISCOVER_TIMEOUT_MINS) }}
        run: bash ./.github/scripts/docker_bitcoin_majors.sh "${START_MAJOR}"

  # Run tests against each supported Bitcoin version in one job. The test
  # suite is short, so sharing setup is cheaper than a job per version.
  test-rpc:
    name: Test Bitcoin Versions
    needs:
      - discover-bitcoin-majors
    if: always() && !cancelled() && needs.discover-bitcoin-majors.result != 'failure'
    runs-on: ubuntu-latest
    env:
      BITCOIN_VERSIONS: ${{ needs.discover-bitcoin-majors.outputs.versions }}
    steps:
      ############################################################################
      ### Setup test environment
      ############################################################################
      
      # Checkout the code
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
     
      # Restore bitcoin cache data
      - name: Restore Bitcoin Binary Cache
        uses: ./.github/actions/cache/bitcoin
        with:
          action: restore
     
      # Symlink bitcoind to $PATH
      - name: Link Bitcoin Binary
        shell: bash
        run: |
          sudo ln -s ~/bitcoin/bin/bitcoind /bin/
     
      # Increase open file descriptors limit
      - name: Increase Open File Descriptors
        shell: bash
        run: |
          sudo prlimit --nofile=4096:4096
        
      # Restore Nextest archive artifact
      - name: Restore Nextest Archive Artifact
        uses: ./.github/actions/artifacts/nextest-archive
        with:
          action: restore
          archive-file: ${{ inputs.archive-file }}

      ############################################################################
      ### Run tests
      ############################################################################

      # Run the suite against every discovered Bitcoin version. Keep going after
      # failures so one broken version does not hide results for later versions.
      - name: Run tests across Bitcoin Core versions
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT_MINS) }}
        env:
          LLVM_PROFILE_FILE: /dev/null
          TEST_ARCHIVE_FILE: ${{ inputs.archive-file }}
        run: |
          # Safely replace a leading ~ with the actual absolute $HOME path
          TEST_ARCHIVE_FILE="${TEST_ARCHIVE_FILE/#\~/$HOME}"
          export TEST_ARCHIVE_FILE

          run_bitcoin_rpc_tests() {
            local bitcoin_version="$1"

            if ! BITCOIN_IMAGE_TAG="$bitcoin_version" cargo-nextest nextest run \
              --config-file ./.github/nextest/ci-nextest.toml \
              --profile ci-parallel \
              --run-ignored all \
              --no-tests fail \
              --archive-file "$TEST_ARCHIVE_FILE" \
              -E 'package(stacks-node) & binary(stacks-node) & test(/^tests::bitcoin::rpc_integrations::/)'
            then
              return 20
            fi
          }
          export -f run_bitcoin_rpc_tests

          mapfile -t bitcoin_versions < <(jq -r '.[]' <<< "$BITCOIN_VERSIONS")
          failed_versions=()

          if (( ${#bitcoin_versions[@]} == 0 )); then
            echo "::error::No Bitcoin Core versions were discovered"
            exit 1
          fi

          for bitcoin_version in "${bitcoin_versions[@]}"; do
            echo "::group::Bitcoin Core ${bitcoin_version}"

            version_status=0
            if ! timeout --kill-after=30s "${IMAGE_PULL_TIMEOUT_MINS}m" \
              docker pull "bitcoin/bitcoin:${bitcoin_version}"
            then
              version_status=10
            else
              # Expand $1 in the child Bash process.
              # shellcheck disable=SC2016
              timeout --kill-after=30s "${PER_VERSION_TEST_TIMEOUT_MINS}m" \
                bash -c 'run_bitcoin_rpc_tests "$1"' _ "$bitcoin_version" \
                || version_status=$?
            fi

            case "$version_status" in
              0) ;;
              10) failed_versions+=("${bitcoin_version} (image pull)") ;;
              20) failed_versions+=("${bitcoin_version} (tests)") ;;
              124|137)
                failed_versions+=("${bitcoin_version} (timeout)")
                docker ps --all --quiet \
                  --filter "ancestor=bitcoin/bitcoin:${bitcoin_version}" \
                  | xargs --no-run-if-empty docker rm --force \
                  || true
                ;;
              *) failed_versions+=("${bitcoin_version} (exit ${version_status})") ;;
            esac

            if (( version_status != 0 )); then
              echo "::error::Bitcoin Core ${bitcoin_version} failed with status ${version_status}"
            fi

            echo "::endgroup::"
          done

          if (( ${#failed_versions[@]} > 0 )); then
            printf 'Bitcoin RPC failures: %s\n' "${failed_versions[*]}"
            exit 1
          fi

  # Check that all jobs in this workflow have succeeded.
  #   - will not run if the job is cancelled
  check-tests:
    name: Check Tests
    needs:
      - test-rpc
    if: |
      always() && 
      !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      # Check if all jobs succeeded
      - name: Check Jobs Status
        shell: bash
        env:
          JOBS: ${{ toJson(needs) }}
          SUMMARY_PRINT: "true"
        run: bash ./.github/scripts/check_jobs_status.sh

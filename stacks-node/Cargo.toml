[package]
name = "stacks-node"
version.workspace = true
authors = ["Jude Nelson <jude@stacks.org>", "Aaron Blankstein <aaron@blockstack.com>", "Ludo Galabru <ludovic@blockstack.com>"]
edition = "2021"

[dependencies]
lazy_static = "1.4.0"
pico-args = "0.5.0"
serde = "1"
serde_derive = "1"
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
stacks = { package = "stackslib", path = "../stackslib" }
stacks-marf = { path = "../stacks-marf" }
stx-genesis = { path = "../stx-genesis"}
base64 = "0.12.0"
backtrace = "0.3.77"
libc = "0.2.151"
slog = { version = "2.5.2", features = [ "max_level_trace" ] }
clarity = { path = "../clarity" }
stacks-common = { path = "../stacks-common" }
chrono = "0.4.19"
regex = "1"
libsigner = { path = "../libsigner" }
url = "2.1.0"
rand = { workspace = true }
hashbrown = { workspace = true }
rusqlite = { workspace = true }
tiny_http = { version = "0.12.0", optional = true }
thiserror = { workspace = true }

[target.'cfg(not(any(target_os = "macos", target_os="windows", target_arch = "arm")))'.dependencies]
tikv-jemallocator = {workspace = true}

[dev-dependencies]
warp = { version = "0.4.3", default-features = false, features = ["server"] }
tokio = "1.15"
reqwest = {workspace = true}
clarity = { path = "../clarity", features = ["default", "testing"]}
stacks-common = { path = "../stacks-common", features = ["default", "testing"] }
stacks-codec = { path = "../stacks-codec", features = ["testing"] }
stacks = { package = "stackslib", path = "../stackslib", features = ["default", "testing"] }
stacks-signer = { path = "../stacks-signer", features = ["testing"] }
stacks-inspect = { path = "../contrib/stacks-inspect", default-features = false }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
mutants = "0.0.3"
tiny_http = "0.12.0"
tempfile = "3.3"
mockito = "1.5"
serial_test = "4.0.1"
pinny = { workspace = true }
madhouse = { workspace = true }
proptest = "1.6.*"
stdext = "0.3.1"
testcontainers =  { version = "0.28.0", features = ["blocking"] }

[features]
monitoring_prom = ["stacks/monitoring_prom", "tiny_http"]
slog_json = ["stacks/slog_json", "stacks-common/slog_json", "clarity/slog_json"]
prod-genesis-chainstate = []
default = []
testing = ["stacks-common/testing", "stacks/testing", "stacks-marf/testing", "clarity/testing"]
# Runtime benchmark controls (e.g. `/bench` RPCs)
bench-hooks = ["stacks/bench-hooks"]

[package.metadata.pinny]
allowed = ["ci_skip"]
